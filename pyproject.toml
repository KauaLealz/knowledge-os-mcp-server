[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-mcp"
version = "0.2.0"
description = "MCP server: local knowledge base for Claude agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kauã Leal", email = "kaualealdev@gmail.com"}
]

dependencies = [
    # Faixas fechadas: o fastmcp 4 quebrou a API dos testes sem aviso (get_tools, call_tool).
    "mcp>=2,<3",
    "fastmcp>=4,<5",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0.0",
    "pymysql>=1.1.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Só para MCP_DB_KEY (SQLCipher). Sem wheel para Windows/cp312, por isso é opcional.
crypto = ["sqlcipher3-binary>=0.5.0; sys_platform == 'linux'"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "httpx>=0.27.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
knowledge-mcp = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.mcp" = ["INSTRUCTIONS.md"]
"src.api" = ["static/**/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
