<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge OS</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Aplica o tema antes do primeiro paint (sem flash). Funciona sem storage.
    (function () {
      try {
        var t = localStorage.getItem('kos.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  {
    "imports": {
      "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/+esm",
      "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.12/+esm",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.2.6/+esm",
      "highlight.js": "https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common/+esm"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
<noscript><div class="fullscreen"><div class="box"><h3>Knowledge OS</h3><p>Este painel precisa de JavaScript.</p></div></div></noscript>

<!-- Sprite de ícones (traço, 24x24) -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-context" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-rule" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-pattern" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-procedure" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 7l1.5-1.5V10M4 14h2.5L4 17h2.5"/></symbol>
  <symbol id="i-knowledge" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></symbol>
  <symbol id="i-insight" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-artifact" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-task" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-chevrons" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.5-4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><path d="M16 4v4M10 10v4M18 16v4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4V4h11v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13 7 4 4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h0"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>

<div x-data x-cloak>

  <!-- Sessão expirada -->
  <div class="fullscreen" x-show="$store.app.expired" role="alert">
    <div class="box">
      <svg class="ic" style="width:32px;height:32px;color:var(--text-3)"><use href="#i-alert"/></svg>
      <h2>Sessão expirada</h2>
      <p class="muted">Abra a URL impressa por <code>knowledge-mcp ui</code> para entrar de novo.</p>
    </div>
  </div>

  <!-- Falha ao iniciar -->
  <div class="fullscreen" x-show="!$store.app.expired && $store.app.bootError" role="alert">
    <div class="box">
      <svg class="ic" style="width:32px;height:32px;color:var(--danger)"><use href="#i-alert"/></svg>
      <h2>Não foi possível carregar</h2>
      <p class="muted" x-text="$store.app.bootError"></p>
      <button class="btn" @click="$store.app.boot()">Tentar de novo</button>
    </div>
  </div>

  <div class="app" x-show="!$store.app.expired && !$store.app.bootError"
       :class="{ wide: $store.app.wide, 'drawer-open': $store.app.drawer }">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" aria-label="Navegação">
      <a class="brand" :href="$store.app.connId ? $store.app.hConn() : '#/'">
        <span class="brand-mark"><svg class="ic"><use href="#i-knowledge"/></svg></span>
        Knowledge OS
      </a>

      <div class="switcher">
        <!-- Connection -->
        <div class="dd" x-data="dropdown" @click.outside="close()" @keydown.escape.window="close()">
          <button class="dd-btn" @click="toggle()" :aria-expanded="open" aria-haspopup="listbox">
            <svg class="ic"><use href="#i-db"/></svg>
            <span class="dd-text">
              <span class="dd-label">Connection</span>
              <span class="dd-value" x-text="$store.app.connName"></span>
            </span>
            <svg class="ic" style="color:var(--text-3)"><use href="#i-chevrons"/></svg>
          </button>
          <div class="dd-menu" x-show="open" x-cloak role="listbox">
            <template x-for="c in $store.app.connections" :key="c.id">
              <button class="dd-item" role="option" :class="{ active: c.id === $store.app.connId }"
                      :disabled="!c.enabled" @click="close(); $store.app.pickConnection(c.id)">
                <span class="dot" :class="{ off: !c.enabled }"></span>
                <span class="grow" x-text="c.name"></span>
                <span class="chip accent" x-show="c.is_default">Default</span>
              </button>
            </template>
          </div>
        </div>

        <!-- Workspace -->
        <div class="dd" x-data="dropdown" @click.outside="close()" @keydown.escape.window="close()">
          <button class="dd-btn" @click="toggle()" :aria-expanded="open" aria-haspopup="listbox">
            <svg class="ic"><use href="#i-box"/></svg>
            <span class="dd-text">
              <span class="dd-label">Workspace</span>
              <span class="dd-value" x-text="$store.app.workspace ? $store.app.workspace.name : 'Selecionar…'"></span>
            </span>
            <svg class="ic" style="color:var(--text-3)"><use href="#i-chevrons"/></svg>
          </button>
          <div class="dd-menu" x-show="open" x-cloak role="listbox">
            <template x-for="w in $store.app.workspaces" :key="w.id">
              <button class="dd-item" role="option" :class="{ active: w.id === $store.app.route.params.ws }"
                      @click="close(); $store.app.pickWorkspace(w.id)">
                <span class="grow" x-text="w.name"></span>
              </button>
            </template>
            <div class="dd-empty" x-show="!$store.app.workspaces.length">Nenhum workspace nesta conexão.</div>
          </div>
        </div>
      </div>

      <!-- Árvore Workspace → Domain → Item -->
      <nav class="tree" aria-label="Árvore do workspace">
        <template x-if="$store.app.route.params.ws && $store.app.treeLoading && !$store.app.tree">
          <div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:85%"></div></div>
        </template>
        <template x-if="$store.app.route.params.ws && $store.app.tree">
          <div>
            <div class="tree-head">
              <span x-text="$store.app.workspace ? $store.app.workspace.name : 'Workspace'"></span>
            </div>
            <template x-for="d in $store.app.tree.domains" :key="d.id">
              <div>
                <div class="tree-row" :class="{ active: $store.app.route.name === 'domain' && $store.app.route.params.dm === d.id }">
                  <button class="tw" @click="$store.app.toggleDomain(d.id)"
                          :aria-label="($store.app.isOpen(d.id) ? 'Recolher ' : 'Expandir ') + d.name"
                          :aria-expanded="$store.app.isOpen(d.id)">
                    <svg class="ic" :class="{ open: $store.app.isOpen(d.id) }"><use href="#i-chevron"/></svg>
                  </button>
                  <a class="tree-link" :href="$store.app.hDomain(d.id)">
                    <svg class="ic"><use href="#i-folder"/></svg>
                    <span class="tl-text" x-text="d.name"></span>
                    <span class="count" x-text="d.item_count"></span>
                  </a>
                </div>
                <div class="tree-items" x-show="$store.app.isOpen(d.id)">
                  <template x-for="it in d.items" :key="it.id">
                    <a class="tree-item" :class="{ active: $store.app.route.params.item === it.id }"
                       :href="$store.app.hItem(d.id, it.id)" :title="it.title">
                      <svg class="ic"><use :href="'#i-' + $icon(it.type)"/></svg>
                      <span x-text="it.title"></span>
                    </a>
                  </template>
                  <div class="tree-empty" x-show="!d.items.length">Sem itens</div>
                </div>
              </div>
            </template>
            <div class="tree-empty" x-show="!$store.app.tree.domains.length">Este workspace ainda não tem domains.</div>
          </div>
        </template>
        <div class="tree-empty" x-show="$store.app.route.params.ws && $store.app.treeError" x-text="$store.app.treeError"></div>
        <div class="tree-empty" x-show="!$store.app.route.params.ws">Escolha um workspace para ver a árvore.</div>
      </nav>

      <div class="side-foot">
        <a class="side-link" :class="{ active: $store.app.route.name === 'connections' }" :href="$store.app.hConnections()">
          <svg class="ic"><use href="#i-settings"/></svg> Configurações · Conexões
        </a>
      </div>
    </aside>
    <div class="scrim" @click="$store.app.drawer = false"></div>

    <!-- ===== Conteúdo ===== -->
    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" @click="$store.app.drawer = true" aria-label="Abrir menu">
          <svg class="ic"><use href="#i-menu"/></svg>
        </button>
        <div class="spacer"></div>
        <button class="btn icon ghost" @click="$store.app.toggleWide()" :aria-pressed="$store.app.wide"
                title="Largura do conteúdo" aria-label="Alternar largura do conteúdo">
          <svg class="ic"><use href="#i-expand"/></svg>
        </button>
        <button class="btn icon ghost" @click="$store.app.cycleTheme()"
                :title="'Tema: ' + $store.app.theme" :aria-label="'Tema: ' + $store.app.theme">
          <svg class="ic"><use :href="'#i-' + ($store.app.theme === 'dark' ? 'moon' : $store.app.theme === 'light' ? 'sun' : 'monitor')"/></svg>
        </button>
      </header>

      <!-- Carregando -->
      <div class="page" x-show="!$store.app.ready">
        <div class="doc"><div class="skeleton" style="height:30px;width:40%;margin:0 0 16px"></div><div class="skeleton" style="margin:0 0 10px"></div><div class="skeleton" style="width:80%;margin:0"></div></div>
      </div>

      <template x-if="$store.app.ready">
        <div>

          <!-- Conexão: lista de workspaces -->
          <template x-if="$store.app.route.name === 'connection'">
            <div class="page"><div class="doc">
              <nav class="crumbs"><span x-text="$store.app.connName"></span></nav>
              <h1 class="page-title">Workspaces</h1>
              <p class="page-lead">Escolha um workspace para navegar pelo conhecimento.</p>
              <div class="state error" x-show="$store.app.wsError" role="alert">
                <svg class="ic"><use href="#i-alert"/></svg>
                <h3>Não foi possível listar os workspaces</h3>
                <p x-text="$store.app.wsError"></p>
                <button class="btn" @click="$store.app.loadWorkspaces()">Tentar de novo</button>
              </div>
              <div class="card-grid" x-show="!$store.app.wsError">
                <template x-for="w in $store.app.workspaces" :key="w.id">
                  <a class="card" :href="$store.app.hWs(w.id)">
                    <span class="card-title"><svg class="ic"><use href="#i-box"/></svg><span class="tl-text" x-text="w.name"></span></span>
                    <span class="card-desc" x-text="w.description || 'Sem descrição'"></span>
                    <span class="card-foot" x-show="w.stats">
                      <span><b x-text="w.stats?.domains"></b> domains</span>
                      <span><b x-text="w.stats?.items"></b> itens</span>
                    </span>
                  </a>
                </template>
              </div>
              <div class="state" x-show="!$store.app.wsError && !$store.app.workspaces.length && !$store.app.wsLoading">
                <svg class="ic"><use href="#i-box"/></svg>
                <h3>Nenhum workspace ainda</h3>
                <p>Esta conexão está vazia. Crie um workspace para começar.</p>
              </div>
            </div></div>
          </template>

          <!-- Workspace -->
          <template x-if="$store.app.route.name === 'workspace'">
            <div class="page" x-data="workspaceView"><div class="doc">
              <template x-if="$store.app.workspace">
                <div>
                  <nav class="crumbs">
                    <a :href="$store.app.hConn()" x-text="$store.app.connName"></a><span class="sep">/</span>
                    <span x-text="$store.app.workspace.name"></span>
                  </nav>
                  <h1 class="page-title" x-text="$store.app.workspace.name"></h1>
                  <p class="page-lead" x-show="$store.app.workspace.description" x-text="$store.app.workspace.description"></p>
                  <div class="page-meta" x-show="$store.app.tree">
                    <span><b x-text="$store.app.tree?.domains.length"></b> domains</span>
                    <span><b x-text="totalItems"></b> itens</span>
                    <span>criado <b x-text="$ago($store.app.workspace.created_at)"></b></span>
                  </div>

                  <div class="section-title">Domains</div>
                  <div class="card-grid">
                    <template x-for="d in $store.app.tree?.domains || []" :key="d.id">
                      <a class="card" :href="$store.app.hDomain(d.id)">
                        <span class="card-title"><svg class="ic"><use href="#i-folder"/></svg><span class="tl-text" x-text="d.name"></span><span class="count" x-text="d.item_count"></span></span>
                        <span class="card-desc" x-show="d.description" x-text="d.description"></span>
                        <ul class="mini-list">
                          <template x-for="it in previewItems(d)" :key="it.id"><li x-text="'· ' + it.title"></li></template>
                        </ul>
                      </a>
                    </template>
                  </div>
                  <div class="state" x-show="$store.app.tree && !$store.app.tree.domains.length">
                    <svg class="ic"><use href="#i-folder"/></svg>
                    <h3>Sem domains</h3>
                    <p>Este workspace ainda não tem domains.</p>
                  </div>

                  <template x-if="recent.length">
                    <div>
                      <div class="section-title">Atualizados recentemente</div>
                      <div class="item-list">
                        <template x-for="it in recent" :key="it.id">
                          <a class="item-row" :href="$store.app.hItem(it.domain_id, it.id)">
                            <svg class="ic"><use :href="'#i-' + $icon(it.type)"/></svg>
                            <div>
                              <div class="ir-title" x-text="it.title"></div>
                              <div class="ir-meta">
                                <span class="chip outline" x-text="it.domain_name"></span>
                                <span class="chip" :class="'mc-' + it.memory_class" x-text="it.memory_class"></span>
                                <span class="muted" style="font-size:12.5px" x-text="$ago(it.updated_at)"></span>
                              </div>
                            </div>
                          </a>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
              <div class="state error" x-show="!$store.app.workspace && !$store.app.wsLoading" role="alert">
                <svg class="ic"><use href="#i-alert"/></svg>
                <h3>Workspace não encontrado</h3>
                <p>Ele pode ter sido removido ou pertencer a outra conexão.</p>
                <a class="btn" :href="$store.app.hConn()">Ver workspaces</a>
              </div>
            </div></div>
          </template>

          <!-- Domain -->
          <template x-if="$store.app.route.name === 'domain'">
            <div class="page" x-data="domainView"><div class="doc">
              <template x-if="$store.app.domain">
                <div>
                  <nav class="crumbs">
                    <a :href="$store.app.hConn()" x-text="$store.app.connName"></a><span class="sep">/</span>
                    <a :href="$store.app.hWs()" x-text="$store.app.workspace?.name"></a><span class="sep">/</span>
                    <span x-text="$store.app.domain.name"></span>
                  </nav>
                  <h1 class="page-title" x-text="$store.app.domain.name"></h1>
                  <p class="page-lead" x-show="$store.app.domain.description" x-text="$store.app.domain.description"></p>
                  <div class="page-meta"><span><b x-text="$store.app.domain.item_count"></b> itens</span></div>

                  <div class="toolbar" x-show="items.length">
                    <select class="select sm" x-model="typeFilter" aria-label="Filtrar por type">
                      <option value="">Todos os types</option>
                      <template x-for="t in types" :key="t"><option :value="t" x-text="t"></option></template>
                    </select>
                    <select class="select sm" x-model="sort" aria-label="Ordenar">
                      <option value="title">Ordem alfabética</option>
                      <option value="recent">Mais recentes</option>
                    </select>
                    <span class="grow"></span>
                    <span class="muted" style="font-size:13px" x-text="filtered.length + ' de ' + items.length"></span>
                  </div>

                  <div class="item-list" x-show="filtered.length">
                    <template x-for="it in filtered" :key="it.id">
                      <a class="item-row" :href="$store.app.hItem($store.app.domain.id, it.id)">
                        <svg class="ic"><use :href="'#i-' + $icon(it.type)"/></svg>
                        <div>
                          <div class="ir-title" x-text="it.title"></div>
                          <div class="ir-sum" x-text="it.summary"></div>
                          <div class="ir-meta">
                            <span class="chip accent" x-text="it.type"></span>
                            <span class="chip" :class="'mc-' + it.memory_class" x-text="it.memory_class"></span>
                            <span class="conf" :class="$conf(it.confidence)" x-show="it.confidence != null">
                              <span class="conf-bar"><i :style="'width:' + it.confidence + '%'"></i></span><span x-text="it.confidence + '%'"></span>
                            </span>
                            <span class="muted" style="font-size:12.5px" x-text="$ago(it.updated_at)"></span>
                          </div>
                        </div>
                      </a>
                    </template>
                  </div>
                  <div class="state" x-show="!loading && !error && !items.length">
                    <svg class="ic"><use href="#i-folder"/></svg>
                    <h3>Domain vazio</h3>
                    <p>Ainda não há itens neste domain.</p>
                  </div>
                  <div class="state error" x-show="error" role="alert">
                    <svg class="ic"><use href="#i-alert"/></svg>
                    <h3>Não foi possível carregar os itens</h3>
                    <p x-text="error"></p>
                    <button class="btn" @click="load()">Tentar de novo</button>
                  </div>
                </div>
              </template>
              <div class="state error" x-show="!$store.app.domain && !$store.app.treeLoading" role="alert">
                <svg class="ic"><use href="#i-alert"/></svg>
                <h3>Domain não encontrado</h3>
                <p>Ele pode ter sido removido.</p>
                <a class="btn" :href="$store.app.hWs()">Voltar ao workspace</a>
              </div>
            </div></div>
          </template>

          <!-- Item (preenchido na T5) -->
          <template x-if="$store.app.route.name === 'item'">
            <div class="page"><div class="doc">
              <h1 class="page-title" x-text="$store.app.currentItem?.title || 'Item'"></h1>
            </div></div>
          </template>

          <!-- Configurações · Conexões (T8) -->
          <template x-if="$store.app.route.name === 'connections'">
            <div class="page"><div class="doc">
              <nav class="crumbs"><span>Configurações</span></nav>
              <h1 class="page-title">Conexões</h1>
              <div class="state">
                <svg class="ic"><use href="#i-settings"/></svg>
                <h3>Em construção</h3>
                <p>A gestão de conexões chega na próxima etapa.</p>
              </div>
            </div></div>
          </template>

          <template x-if="$store.app.route.name === 'notfound'">
            <div class="page"><div class="doc">
              <div class="state">
                <svg class="ic"><use href="#i-search"/></svg>
                <h3>Página não encontrada</h3>
                <p>O endereço não corresponde a nenhuma tela.</p>
                <a class="btn" href="#/">Ir para o início</a>
              </div>
            </div></div>
          </template>

        </div>
      </template>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" aria-live="polite">
    <template x-for="t in $store.app.toasts" :key="t.id">
      <div class="toast" :class="t.kind" x-text="t.message"></div>
    </template>
  </div>
</div>
</body>
</html>
