<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge OS</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M16 10 10 21.5M16 10l6 11.5M10 21.5h12' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='10' r='3' fill='white'/%3E%3Ccircle cx='10' cy='21.5' r='3' fill='white'/%3E%3Ccircle cx='22' cy='21.5' r='3' fill='white'/%3E%3C/svg%3E">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
<noscript><div class="fullscreen"><div class="box"><h3>Knowledge OS</h3><p>This panel requires JavaScript.</p></div></div></noscript>

<!-- Sprite: logo colorida (viewBox 32) e ícones de ação/navegação (viewBox 24, traço 1.75, sem preenchimento) -->
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 32 32"><rect width='32' height='32' rx='7' fill='#4f46e5'/><path d='M16 10 10 21.5M16 10l6 11.5M10 21.5h12' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='16' cy='10' r='3' fill='white'/><circle cx='10' cy='21.5' r='3' fill='white'/><circle cx='22' cy='21.5' r='3' fill='white'/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-chevrons" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.5-4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h8M16 6h4M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4V4h11v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13 7 4 4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6z"/></symbol>
  <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 6h7.4M7.4 8.2l3.2 7.6M16.6 8.2l-3.2 7.6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.5"/></symbol>
</svg>

<div x-data x-cloak>

  <!-- Failed to start -->
  <div class="fullscreen" x-show="$store.app.bootError" role="alert">
    <div class="box">
      <svg class="logo"><use href="#logo"/></svg>
      <h2>Could not load</h2>
      <p class="muted" x-text="$store.app.bootError"></p>
      <button class="btn" @click="$store.app.boot()">Try again</button>
    </div>
  </div>

  <div class="app" x-show="!$store.app.bootError"
       :class="{ 'drawer-open': $store.app.drawer }">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" aria-label="Navigation">
      <a class="brand" :href="$store.app.connId ? $store.app.hConn() : '#/'">
        <svg class="logo"><use href="#logo"/></svg>
        <span>Knowledge OS</span>
      </a>

      <div class="tree-empty" x-show="$store.app.connError" role="alert">
        <span x-text="'Connections unavailable: ' + $store.app.connError"></span>
        <button class="btn" @click="$store.app.boot()">Try again</button>
      </div>

      <div class="switcher">
        <!-- Connection -->
        <div class="dd" x-data="dropdown" @click.outside="close()" @keydown.escape.window="close()">
          <button class="dd-btn" @click="toggle()" :aria-expanded="open" aria-haspopup="listbox">
            <svg class="ic"><use href="#i-db"/></svg>
            <span class="dd-text">
              <span class="dd-label">Connection</span>
              <span class="dd-value" x-text="$store.app.connName"></span>
            </span>
            <svg class="ic dd-chev"><use href="#i-chevrons"/></svg>
          </button>
          <div class="dd-menu" x-show="open" x-cloak role="listbox">
            <template x-for="c in $store.app.connections" :key="c.id">
              <button class="dd-item" role="option" :class="{ active: c.id === $store.app.connId }"
                      :disabled="!c.enabled" @click="close(); $store.app.pickConnection(c.id)">
                <span class="dot" :class="{ off: !c.enabled }"></span>
                <span class="grow" x-text="c.name"></span>
                <span class="chip accent" x-show="c.is_default">Default</span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <!-- Árvore: todos os workspaces da conexão, cada um como gaveta (Workspace → Project → Subject → Item) -->
      <nav class="tree" aria-label="Workspaces">
        <template x-for="w in $store.app.workspaces" :key="w.id">
          <div>
            <div class="tree-row" :class="{ active: $store.app.route.name === 'workspace' && $store.app.route.params.ws === w.id }">
              <button class="btn icon ghost tree-toggle" @click="$store.app.toggleWorkspace(w.id)"
                      :aria-label="($store.app.isWorkspaceOpen(w.id) ? 'Collapse ' : 'Expand ') + w.name"
                      :aria-expanded="$store.app.isWorkspaceOpen(w.id)">
                <svg class="ic" :class="{ open: $store.app.isWorkspaceOpen(w.id) }"><use href="#i-chevron"/></svg>
              </button>
              <a class="tree-link" :href="$store.app.hWs(w.id)">
                <svg class="ic"><use href="#i-box"/></svg>
                <span class="tl-text" x-text="w.name"></span>
              </a>
            </div>

            <div class="tree-items" x-show="$store.app.isWorkspaceOpen(w.id)">
              <template x-if="$store.app.treeLoadingWs[w.id] && !$store.app.trees[w.id]">
                <div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>
              </template>
              <template x-if="$store.app.trees[w.id]">
                <div>
                  <template x-for="p in ($store.app.trees[w.id]?.projects || [])" :key="p.id">
                    <div>
                      <div class="tree-row" :class="{ active: $store.app.route.name === 'project' && $store.app.route.params.pj === p.id }">
                        <button class="btn icon ghost tree-toggle" @click="$store.app.toggleProject(p.id)"
                                :aria-label="($store.app.isOpen(p.id) ? 'Collapse ' : 'Expand ') + p.name"
                                :aria-expanded="$store.app.isOpen(p.id)">
                          <svg class="ic" :class="{ open: $store.app.isOpen(p.id) }"><use href="#i-chevron"/></svg>
                        </button>
                        <a class="tree-link" :href="$store.app.hProjectIn(w.id, p.id)">
                          <svg class="ic"><use href="#i-folder"/></svg>
                          <span class="tl-text" x-text="p.name"></span>
                          <span class="count" x-text="p.item_count"></span>
                        </a>
                      </div>
                      <div class="tree-items" x-show="$store.app.isOpen(p.id)">
                        <template x-for="s in (p.subjects || [])" :key="s.id">
                          <div class="tree-subject">
                            <div class="tree-row">
                              <button class="btn icon ghost tree-toggle" @click="$store.app.toggleProject(p.id + ':' + s.id)"
                                      :aria-label="($store.app.isOpen(p.id + ':' + s.id) ? 'Collapse ' : 'Expand ') + s.name"
                                      :aria-expanded="$store.app.isOpen(p.id + ':' + s.id)">
                                <svg class="ic" :class="{ open: $store.app.isOpen(p.id + ':' + s.id) }"><use href="#i-chevron"/></svg>
                              </button>
                              <a class="tree-link" :href="$store.app.hSubjectIn(w.id, p.id, s.id)"
                                 :class="{ active: $store.app.route.name === 'subject' && $store.app.route.params.subj === s.id }">
                                <span class="tl-text" x-text="s.name"></span>
                                <span class="count" x-text="s.item_count"></span>
                              </a>
                            </div>
                            <div class="tree-items" x-show="$store.app.isOpen(p.id + ':' + s.id)">
                              <template x-for="it in s.items" :key="it.id">
                                <a class="tree-item" :class="{ active: $store.app.route.params.item === it.id }"
                                   :href="$store.app.hItemIn(w.id, p.id, it.id)" :title="it.title">
                                  <span class="tdot" :class="$tc(it.type)" aria-hidden="true"></span>
                                  <span class="sr-only" x-text="$kind(it.type, it.subtype) + ': '"></span><span x-show="it.status === 'review'" title="In review">⚠ </span><span x-text="it.title"></span>
                                </a>
                              </template>
                              <div class="tree-empty" x-show="!s.items.length">No items</div>
                            </div>
                          </div>
                        </template>
                        <template x-for="it in p.items" :key="it.id">
                          <a class="tree-item" :class="{ active: $store.app.route.params.item === it.id }"
                             :href="$store.app.hItemIn(w.id, p.id, it.id)" :title="it.title">
                            <span class="tdot" :class="$tc(it.type)" aria-hidden="true"></span>
                            <span class="sr-only" x-text="$kind(it.type, it.subtype) + ': '"></span><span x-show="it.status === 'review'" title="In review">⚠ </span><span x-text="it.title"></span>
                          </a>
                        </template>
                        <div class="tree-empty" x-show="!p.items.length && !(p.subjects || []).length">No items</div>
                      </div>
                    </div>
                  </template>
                  <div class="tree-empty" x-show="!($store.app.trees[w.id]?.projects?.length)">This workspace has no projects yet.</div>
                </div>
              </template>
              <div class="tree-empty" x-show="$store.app.treeErrorWs[w.id]" x-text="$store.app.treeErrorWs[w.id]"></div>
            </div>
          </div>
        </template>
        <div class="tree-empty" x-show="$store.app.connections.length && !$store.app.workspaces.length">No workspaces in this connection.</div>
        <div class="tree-empty" x-show="!$store.app.connError && !$store.app.connections.length">Nenhuma conexão. Crie uma pelo MCP com <code>connection_create</code>.</div>
      </nav>

      <div class="side-foot">
        <a class="side-link" x-show="$store.app.connId" :class="{ active: $store.app.route.name === 'tags' }" :href="$store.app.hTags()">
          <svg class="ic"><use href="#i-tag"/></svg> Tags
        </a>
        <a class="side-link" :class="{ active: $store.app.route.name === 'connections' }" :href="$store.app.hConnections()">
          <svg class="ic"><use href="#i-settings"/></svg> Settings · Connections
        </a>
      </div>
    </aside>
    <div class="scrim" @click="$store.app.drawer = false"></div>

    <!-- ===== Conteúdo ===== -->
    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" @click="$store.app.drawer = true" aria-label="Open menu">
          <svg class="ic"><use href="#i-menu"/></svg>
        </button>
        <button class="search-btn" @click="$store.app.paletteOpen = true" aria-label="Search and commands">
          <svg class="ic"><use href="#i-search"/></svg>
          <span class="search-txt">Search…</span>
          <kbd x-text="$store.app.isMac ? '⌘K' : 'Ctrl K'"></kbd>
        </button>
        <div class="spacer"></div>
        <div class="dd" x-data="dropdown" @click.outside="close()" @keydown.escape.window="close()">
          <button class="btn" @click="toggle()" :aria-expanded="open" aria-haspopup="menu">
            <svg class="ic"><use href="#i-plus"/></svg> New
          </button>
          <div class="dd-menu right" x-show="open" x-cloak role="menu">
            <button class="dd-item" role="menuitem" :disabled="!$store.app.route.params.ws" @click="close(); $store.app.openModal('item')">
              <svg class="ic"><use href="#i-file"/></svg><span class="grow">New item</span></button>
            <button class="dd-item" role="menuitem" :disabled="!$store.app.workspaces.length" @click="close(); $store.app.openModal('project')">
              <svg class="ic"><use href="#i-folder"/></svg><span class="grow">New project</span></button>
            <button class="dd-item" role="menuitem" @click="close(); $store.app.openModal('workspace')">
              <svg class="ic"><use href="#i-box"/></svg><span class="grow">New workspace</span></button>
          </div>
        </div>
        <button class="btn icon ghost" @click="$store.app.toggleTheme()"
                :title="$store.app.themeAction" :aria-label="$store.app.themeAction">
          <svg class="ic"><use :href="'#i-' + ($store.app.theme === 'dark' ? 'sun' : 'moon')"/></svg>
        </button>
      </header>

      <!-- Carregando -->
      <div class="page" x-show="!$store.app.ready" aria-busy="true">
        <div class="doc"><svg class="logo lg"><use href="#logo"/></svg><div class="skeleton" style="height:30px;width:40%;margin:0 0 16px"></div><div class="skeleton" style="margin:0 0 10px"></div><div class="skeleton" style="width:80%;margin:0"></div></div>
      </div>

      <template x-if="$store.app.ready">
        <div>

          <!-- Início sem conexão -->
          <template x-if="$store.app.route.name === 'home' && !$store.app.connError && !$store.app.connections.length">
            <div class="page"><div class="doc">
              <div class="state">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Nenhuma conexão ainda</h3>
                <p>O Knowledge OS guarda os dados numa pasta (repositório git) — a conexão. A criação é pelo MCP, com a ferramenta <code>connection_create</code>. Por exemplo:</p>
                <pre class="mono"><code>connection_create(name="pessoal", path="C:\\caminho\\da\\pasta")</code></pre>
                <p class="form-hint-text">Depois de criar, recarregue esta página.</p>
                <a class="btn" href="#/settings/connections">Ver conexões</a>
              </div>
            </div></div>
          </template>
          <!-- /Início sem conexão -->

          <!-- Conexão: lista de workspaces -->
          <template x-if="$store.app.route.name === 'connection'">
            <div class="page"><div class="doc">
              <nav class="crumbs"><span x-text="$store.app.connName"></span></nav>
              <div class="page-head">
                <h1 class="page-title">Workspaces</h1>
                <div class="toolbar"><button class="btn primary" @click="$store.app.openModal('workspace')"><svg class="ic"><use href="#i-plus"/></svg> New workspace</button></div>
              </div>
              <div class="state error" x-show="$store.app.wsError" role="alert">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Could not list workspaces</h3>
                <p x-text="$store.app.wsError"></p>
                <button class="btn" @click="$store.app.loadWorkspaces()">Try again</button>
              </div>
              <div class="card-grid" x-show="!$store.app.wsError">
                <template x-for="w in $store.app.workspaces" :key="w.id">
                  <a class="card" :href="$store.app.hWs(w.id)">
                    <span class="card-title"><svg class="ic"><use href="#i-box"/></svg><span class="tl-text" x-text="w.name"></span></span>
                    <span class="card-desc" x-text="w.description || 'No description'"></span>
                    <span class="card-foot" x-show="w.stats">
                      <span><b x-text="w.stats?.projects"></b> projects</span>
                      <span><b x-text="w.stats?.items"></b> items</span>
                      <span x-text="'Scope: ' + $scopetext(w.scope, w.scope_explicit, null)"></span>
                    </span>
                  </a>
                </template>
              </div>
              <div class="state" x-show="!$store.app.wsError && !$store.app.workspaces.length && !$store.app.wsLoading">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>No workspaces yet</h3>
                <p>This connection is empty. Create a workspace to get started.</p>
              </div>
            </div></div>
          </template>

          <!-- Workspace -->
          <template x-if="$store.app.route.name === 'workspace'">
            <div class="page" x-data="workspaceView"><div class="doc">
              <template x-if="$store.app.workspace">
                <div>
                  <nav class="crumbs">
                    <a :href="$store.app.hConn()" x-text="$store.app.connName"></a><span class="sep">/</span>
                    <span x-text="$store.app.workspace.name"></span>
                  </nav>
                  <div class="page-head">
                    <h1 class="page-title" x-text="$store.app.workspace.name"></h1>
                    <div class="toolbar">
                      <label class="scope-pick">
                        <span class="chip outline" :class="{ inherited: !$store.app.workspace.scope_explicit }" x-text="'Scope: ' + scopeInfo"></span>
                        <select class="select sm" aria-label="Workspace scope" @change="setScope($event.target.value)">
                          <option value="" :selected="!$store.app.workspace.scope_explicit">Not set (scoped)</option>
                          <template x-for="sc in scopes" :key="sc"><option :value="sc" :selected="sc === $store.app.workspace.scope_explicit" x-text="sc"></option></template>
                        </select>
                      </label>
                      <a class="btn" :href="graphHref()"><svg class="ic"><use href="#i-graph"/></svg> View graph</a>
                      <button class="btn" @click="$store.app.openModal('project')"><svg class="ic"><use href="#i-plus"/></svg> New project</button>
                    </div>
                  </div>

                  <div class="searchbar">
                    <label class="searchbox">
                      <svg class="ic"><use href="#i-search"/></svg>
                      <input type="search" class="input" x-model="$store.app.filters.q" placeholder="Search in this workspace…" aria-label="Search items" autocomplete="off">
                    </label>
                    <div class="filter-pop" x-data="{ open: false }" @keydown.escape.window="open = false">
                      <button type="button" class="btn icon" :class="{ active: filtering }" @click="open = !open" :aria-expanded="open" aria-haspopup="true" aria-label="Filtros">
                        <svg class="ic"><use href="#i-filter"/></svg>
                      </button>
                      <div class="filter-popover" x-show="open" x-cloak x-transition @click.outside="open = false">
                        <div class="filter-group" x-show="projectFilterOptions.length" x-data="{ open: false }">
                          <button type="button" class="filter-group-title" @click="open = !open" :aria-expanded="open">
                            Project <svg class="ic" :class="{ open }"><use href="#i-chevron"/></svg>
                          </button>
                          <div class="filter-check-list" x-show="open">
                            <template x-for="p in projectFilterOptions" :key="p.id">
                              <label class="filter-check">
                                <input type="checkbox" :checked="filters.projectIds.includes(p.id)" @change="toggleProjectFilter(p.id)">
                                <span x-text="p.name"></span>
                              </label>
                            </template>
                          </div>
                        </div>
                        <div class="filter-group" x-show="subjectFilterOptions.length" x-data="{ open: false }">
                          <button type="button" class="filter-group-title" @click="open = !open" :aria-expanded="open">
                            Subject <svg class="ic" :class="{ open }"><use href="#i-chevron"/></svg>
                          </button>
                          <div class="filter-check-list" x-show="open">
                            <template x-for="s in subjectFilterOptions" :key="s.id">
                              <label class="filter-check">
                                <input type="checkbox" :checked="filters.subjectIds.includes(s.id)" @change="toggleSubjectFilter(s.id)">
                                <span x-text="s.name"></span>
                              </label>
                            </template>
                          </div>
                        </div>
                        <div class="filter-group" x-data="{ open: false }">
                          <button type="button" class="filter-group-title" @click="open = !open" :aria-expanded="open">
                            Type <svg class="ic" :class="{ open }"><use href="#i-chevron"/></svg>
                          </button>
                          <div class="type-chips" role="group" aria-label="Filter by type" x-show="open">
                            <template x-for="c in chipTypes" :key="c.type">
                              <button class="tchip" :class="[$tc(c.type), { on: filters.types.includes(c.type) }]"

                                      :aria-pressed="filters.subtypes.includes(c.subtype)" @click="toggleSubtype(c.subtype)">
                                <span x-text="c.label"></span> <span class="n" x-show="c.count != null" x-text="c.count"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                        <div class="filter-group" x-data="{ open: false }">
                          <button type="button" class="filter-group-title" @click="open = !open" :aria-expanded="open">
                            Sort <svg class="ic" :class="{ open }"><use href="#i-chevron"/></svg>
                          </button>
                          <select class="select sm" x-show="open" x-model="sort" aria-label="Sort">
                            <option value="title">Alphabetical</option>
                            <option value="recent">Most recent</option>
                          </select>
                        </div>
                        <button class="btn ghost sm" x-show="filtering" @click="clearFilters()">Clear filters</button>
                      </div>
                    </div>
                  </div>
                  <div class="banner" role="alert" x-show="searchError">
                    <svg class="ic"><use href="#i-alert"/></svg><span x-text="'Search unavailable: ' + searchError"></span>
                  </div>
                  <span class="muted" x-show="searching">Searching…</span>
                  <div class="item-list">
                    <template x-for="it in visible" :key="it.id">
                      <a class="item-row" :href="$store.app.hItemOf(it)">
                        <div>
                          <div class="ir-title" x-text="it.title"></div>
                          <div class="ir-sum" x-text="it.summary"></div>
                          <div class="ir-meta">
                            <span class="tbadge" :class="$tc(it.type)"><span class="tdot" aria-hidden="true"></span><span x-text="$kind(it.type, it.subtype)"></span></span>
                            <span class="chip warn" x-show="it.status === 'review'" title="In review: check it before trusting it">⚠ Review</span>
                            <span class="chip outline" x-show="it.status && !['active', 'review'].includes(it.status)" x-text="it.expired ? 'expired' : it.status"></span>
                            <span class="chip outline" :class="{ inherited: $inherited(it) }" x-show="it.scope || it.effective_scope" x-text="$iscope(it)"></span>
                            <span class="chip outline" x-show="it.origin" :title="'Origin: ' + it.origin" x-text="$origin(it.origin)"></span>
                            <span class="muted" style="font-size:12.5px" x-show="it.updated_at" x-text="$ago(it.updated_at)"></span>
                          </div>
                        </div>
                      </a>
                    </template>
                  </div>
                  <div class="pager-bar" x-show="!searchMode">
                    <label class="pager-size">
                      <span class="muted" style="font-size:13px">Per page</span>
                      <select class="select sm" x-model.number="pageSize" @change="goToPage(1)" aria-label="Items per page">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                      </select>
                    </label>
                    <span class="muted" style="font-size:13px">Page <b x-text="page"></b> of <b x-text="totalPages"></b> · <span x-text="total"></span> items</span>
                    <div class="pager-nav">
                      <button class="btn icon ghost" :disabled="page <= 1 || loading" @click="prevPage()" aria-label="Previous page">
                        <svg class="ic"><use href="#i-arrow-left"/></svg>
                      </button>
                      <button class="btn icon ghost" :disabled="page >= totalPages || loading" @click="nextPage()" aria-label="Next page">
                        <svg class="ic"><use href="#i-arrow-right"/></svg>
                      </button>
                    </div>
                  </div>
                  <div class="state" x-show="filtering && !visible.length && !searching && !searchError">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>No items found</h3>
                    <p>Nothing matches the search and chosen filters.</p>
                    <button class="btn" @click="clearFilters()">Clear filters</button>
                  </div>
                  <div class="state" x-show="!loading && !error && !items.length && !filtering">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Empty subject</h3>
                    <p>There are no items in this subject yet.</p>
                  </div>
                  <div class="state error" x-show="error" role="alert">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Could not load items</h3>
                    <p x-text="error"></p>
                    <button class="btn" @click="load()">Try again</button>
                  </div>
                </div>
              </template>
              <div class="state error" x-show="!$store.app.subject && !$store.app.treeLoading" role="alert">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Subject not found</h3>
                <p>It may have been removed.</p>
                <a class="btn" :href="$store.app.hProject($store.app.route.params.pj)">Back to project</a>
              </div>
            </div></div>
          </template>

          <!-- Item -->
          <template x-if="$store.app.route.name === 'item'">
            <div class="page" :class="{ 'has-toc': item && headings.length && !$store.app.route.params.edit, editing: $store.app.route.params.edit }" x-data="itemView">
              <div class="doc">
                <div class="skeleton" x-show="loading && !item" style="height:30px;width:50%;margin:0 0 16px"></div>

                <template x-if="item">
                  <article>
                    <nav class="crumbs">
                      <a :href="$store.app.hConn()" x-text="$store.app.connName"></a><span class="sep">/</span>
                      <a :href="$store.app.hWs()" x-text="$store.app.workspace?.name"></a><span class="sep">/</span>
                      <a :href="$store.app.hProject(item.project_id)" x-text="projectName"></a><span class="sep">/</span>
                      <span x-text="item.title"></span>
                      <a class="crumb-back" :href="backHref()"><svg class="ic"><use href="#i-arrow-left"/></svg> Back</a>
                    </nav>

                    <div class="item-head">
                      <h1 class="page-title" x-text="item.title"></h1>
                      <div class="item-actions">
                        <button class="btn" @click="$store.app.toggleEdit()" title="Shortcut: e">
                          <svg class="ic"><use :href="'#i-' + ($store.app.route.params.edit ? 'eye' : 'edit')"/></svg>
                          <span x-text="$store.app.route.params.edit ? 'Read' : 'Edit'"></span> <kbd>e</kbd>
                        </button>
                        <button class="btn" x-show="!$store.app.route.params.edit && item.type !== 'secret'" @click="copyMarkdown()"><svg class="ic"><use href="#i-copy"/></svg> Copy as Markdown</button>
                        <button class="btn" x-show="!$store.app.route.params.edit && item.type !== 'secret'" :aria-pressed="showRaw" @click="showRaw = !showRaw">
                          <svg class="ic"><use href="#i-eye"/></svg> <span x-text="showRaw ? 'View rendered' : 'View Markdown'"></span>
                        </button>
                        <button class="btn danger" x-show="!$store.app.route.params.edit" :disabled="deleting" @click="remove()">
                          <svg class="ic"><use href="#i-x"/></svg>
                          <span x-text="confirmingDelete ? 'Confirm: delete' : 'Delete'"></span>
                        </button>
                      </div>
                    </div>

                    <p class="page-lead" x-text="item.summary"></p>

                    <div class="banner" role="alert" x-show="item.status === 'review'">
                      <svg class="ic"><use href="#i-alert"/></svg>
                      <span>⚠ In review: someone flagged this item as wrong or outdated. Check it, fix it and set the status back to active.</span>
                    </div>


                    <div class="chips">
                      <span class="tbadge lg" :class="$tc(item.type)"><span class="tdot" aria-hidden="true"></span><span x-text="$kind(item.type, item.subtype)"></span></span>
                      <span class="chip warn" x-show="item.status === 'review'">⚠ Review</span>
                      <span class="chip outline" x-show="!['active', 'review'].includes(item.status) || item.expired" x-text="item.expired ? 'expired' : item.status"></span>
                      <span class="chip outline" :class="{ inherited: $inherited(item) }" :title="'Where it is valid: ' + $iscope(item)" x-text="$iscope(item)"></span>
                      <span class="chip outline" :title="'Origin: ' + item.origin" x-text="$origin(item.origin)"></span>
                      <template x-for="t in item.tags" :key="'t' + t"><span class="chip outline" x-text="'#' + t"></span></template>
                      <span class="chip outline" x-show="item.verified_at" :title="'Verified ' + fullDate(item.verified_at) + (item.verified_commit ? ' · ' + item.verified_commit.slice(0, 8) : '')">✓ verified <span x-text="$ago(item.verified_at)"></span></span>
                      <span class="muted" style="font-size:12.5px" :title="fullDate(item.updated_at)" x-text="'updated ' + $ago(item.updated_at)"></span>
                      <button class="btn ghost sm" type="button" x-show="item.type !== 'secret' && !$store.app.route.params.edit" @click="markVerified()" x-text="item.verified_at ? 'Verify again' : 'Mark verified'"></button>
                    </div>

                    <p class="item-meta" x-show="!$store.app.route.params.edit && (item.key || item.subject || item.source || item.ttl_days)">
                      <code class="mono" x-show="item.key" x-text="item.key"></code>
                      <span x-text="[item.subject, item.source && ('source: ' + item.source), item.ttl_days && ('expires ' + fullDate(item.expires_at))].filter(Boolean).join(' · ')"></span>
                    </p>
                    <!-- Segredo · valor -->
                    <template x-if="item.type === 'secret' && !$store.app.route.params.edit">
                      <section class="card secret-box" x-data="secretForm(item, (u) => applyUpdate(u))">
                        <div class="card-title"><span x-text="item.has_value ? 'Value set' : 'No value'"></span></div>
                        <p class="secret-note">The value is encrypted on this machine and never shown again. The agent only uses it by running <code>knowledge-mcp run</code>, without seeing the value.</p>
                        <div class="secret-form">
                          <input class="input" type="password" autocomplete="off" data-1p-ignore data-lpignore="true" spellcheck="false" aria-label="Secret value"
                                 x-show="!multiline" @keydown.enter.prevent="save()"
                                 :placeholder="item.has_value ? 'New value (replaces current)' : 'Paste the value here'" x-model="value">
                          <textarea class="input mono" rows="6" autocomplete="off" data-1p-ignore data-lpignore="true" spellcheck="false" aria-label="Secret value (multiple lines)"
                                    x-show="multiline" placeholder="Paste the key or file content here" x-model="value"></textarea>
                          <button class="btn primary" type="button" :disabled="!value || busy" @click="save()">Save</button>
                          <button class="btn danger" type="button" x-show="item.has_value" :disabled="busy" @click="clear()"
                                  x-text="confirming ? 'Confirm: delete' : 'Delete value'"></button>
                        </div>
                        <label class="secret-multi"><input type="checkbox" x-model="multiline"> Multiple lines (PEM key, kubeconfig) — the text stays visible while you paste</label>
                        <span class="form-error" x-show="error" x-text="error" role="alert"></span>
                      </section>
                    </template>
                    <!-- /Segredo · valor -->

                    <template x-if="!$store.app.route.params.edit && item.type !== 'secret'">
                      <div>
                        <div class="prose" x-show="!showRaw" @click="onProseClick($event)"
                             x-effect="renderInto($el, item.content)"></div>
                        <pre class="raw" x-show="showRaw" x-text="item.content"></pre>
                      </div>
                    </template>

                    <template x-if="item.links.length && !$store.app.route.params.edit">
                      <section>
                        <h2 class="section-title">Links</h2>
                        <ul class="links">
                          <template x-for="l in item.links" :key="l.url">
                            <li><a :href="l.url" target="_blank" rel="noopener noreferrer" x-text="l.title || l.url"></a></li>
                          </template>
                        </ul>
                      </section>
                    </template>

                    <template x-if="$store.app.route.params.edit && item && item.id === $store.app.route.params.item">
                      <div class="editor" x-data="itemEditor(item, (u) => applyUpdate(u))">
                        <div class="editor-meta">
                          <div class="field grow"><label for="ed-title">Title</label>
                            <input id="ed-title" class="input" type="text" maxlength="255" x-model="draft.title"></div>
                          <div class="field"><label for="ed-type">Type</label>
                            <select id="ed-type" class="select" x-model="draft.type">
                              <template x-for="t in types" :key="t"><option :value="t" :selected="t === draft.type" x-text="$tlabel(t)"></option></template>
                            </select></div>
                          <div class="field"><label for="ed-subtype">Subtype</label>
                            <select id="ed-subtype" class="select" x-model="draft.subtype" :disabled="!subtypes.length">
                              <option value="" :selected="!draft.subtype">None</option>
                              <template x-for="st in subtypes" :key="st"><option :value="st" :selected="st === draft.subtype" x-text="$stlabel(st)"></option></template>
                            </select></div>
                          <div class="field"><label for="ed-status">Status</label>
                            <select id="ed-status" class="select" x-model="draft.status">
                              <template x-for="st in statuses" :key="st"><option :value="st" :selected="st === draft.status" x-text="st"></option></template>
                            </select></div>
                          <div class="field"><label for="ed-scope">Scope</label>
                            <select id="ed-scope" class="select" x-model="draft.scope">
                              <option value="" :selected="!draft.scope">Inherit</option>
                              <template x-for="sc in scopes" :key="sc"><option :value="sc" :selected="sc === draft.scope" x-text="sc"></option></template>
                            </select></div>
                          <div class="field grow"><label for="ed-summary">Summary</label>
                            <input id="ed-summary" class="input" type="text" x-model="draft.summary"></div>
                          <div class="field grow"><label for="ed-tags">Tags (comma-separated)</label>
                            <input id="ed-tags" class="input" type="text" x-model="draft.tags"></div>
                          <div class="field"><label for="ed-ttl">Expires in (days)</label>
                            <input id="ed-ttl" class="input" type="number" min="1" placeholder="never" x-model="draft.ttl_days"></div>
                          <div class="field"><label>Origin</label>
                            <span class="chip outline" :title="'Origin: ' + origin" x-text="$origin(origin)"></span></div>
                          <div class="field grow"><label for="ed-links">Links (one per line: Title | https://…)</label>
                            <textarea id="ed-links" class="textarea mono" rows="2" x-model="draft.links" spellcheck="false"></textarea></div>
                        </div>
                        <div class="editor-grid">
                          <div class="editor-col">
                            <label class="editor-label" for="ed-content">Markdown</label>
                            <textarea id="ed-content" x-ref="content" class="textarea editor-ta" x-model="draft.content" spellcheck="false"></textarea>
                          </div>
                          <div class="editor-col">
                            <div class="editor-label">Preview</div>
                            <div class="prose editor-prev" x-effect="preview($el)"></div>
                          </div>
                        </div>
                        <div class="editor-bar">
                          <span class="muted" x-show="dirty">Unsaved changes</span>
                          <span class="form-error" x-show="error" x-text="error" role="alert"></span>
                          <span class="grow"></span>
                          <button class="btn" @click="$store.app.toggleEdit()">Close editor</button>
                          <button class="btn primary" :disabled="!dirty || saving" @click="save()">
                            <span x-text="saving ? 'Saving…' : 'Save'"></span> <kbd x-text="$store.app.isMac ? '⌘ S' : 'Ctrl S'"></kbd>
                          </button>
                        </div>
                      </div>
                    </template>

                    <template x-if="out.length || inc.length">
                      <section class="rels">
                        <h2 class="section-title">Relations</h2>
                        <div class="rel-cols">
                          <div x-show="out.length">
                            <h3 class="rel-h">References</h3>
                            <template x-for="r in out" :key="r.id">
                              <a class="rel" :href="relHref(r)">
                                <span class="chip" x-text="r.type"></span>
                                <svg class="ic"><use href="#i-arrow-right"/></svg>
                                <span class="rel-t" x-text="relTitle(r)"></span>
                                <span class="chip warn" x-show="r.node.status === 'review'">⚠</span>
                              </a>
                            </template>
                          </div>
                          <div x-show="inc.length">
                            <h3 class="rel-h">Referenced by</h3>
                            <template x-for="r in inc" :key="r.id">
                              <a class="rel" :href="relHref(r)">
                                <span class="chip" x-text="r.type"></span>
                                <svg class="ic"><use href="#i-arrow-left"/></svg>
                                <span class="rel-t" x-text="relTitle(r)"></span>
                                <span class="chip warn" x-show="r.node.status === 'review'">⚠</span>
                              </a>
                            </template>
                          </div>
                        </div>
                      </section>
                    </template>

                    <nav class="pager" aria-label="Itens vizinhos">
                      <template x-if="prev">
                        <a class="pager-a" :href="$store.app.hItem(item.project_id, prev.id)">
                          <span class="muted">Previous</span><b x-text="prev.title"></b>
                        </a>
                      </template>
                      <template x-if="next">
                        <a class="pager-a next" :href="$store.app.hItem(item.project_id, next.id)">
                          <span class="muted">Next</span><b x-text="next.title"></b>
                        </a>
                      </template>
                    </nav>
                  </article>
                </template>

                <div class="state error" x-show="notFound" role="alert">
                  <svg class="logo"><use href="#logo"/></svg>
                  <h3>Item not found</h3>
                  <p>It may have been removed or belong to another connection.</p>
                  <a class="btn" :href="$store.app.hWs()">Back to workspace</a>
                </div>
                <div class="state error" x-show="error" role="alert">
                  <svg class="logo"><use href="#logo"/></svg>
                  <h3>Could not load the item</h3>
                  <p x-text="error"></p>
                  <button class="btn" @click="load()">Try again</button>
                </div>
              </div>

              <aside class="toc" x-show="item && headings.length" aria-label="On this page">
                <div class="toc-title">On this page</div>
                <template x-for="h in headings" :key="h.id">
                  <a class="toc-link" :class="{ active: active === h.id, sub: h.level === 3 }"
                     :href="'#' + h.id" @click.prevent="goTo(h.id)" x-text="h.text"></a>
                </template>
              </aside>
            </div>
          </template>

          <!-- Tags gerenciadas: contagem, criar, renomear (mescla) e apagar com prévia -->
          <template x-if="$store.app.route.name === 'tags'">
            <div class="page"><div class="doc" x-data="tagsView">
              <nav class="crumbs">
                <a :href="$store.app.hConn()" x-text="$store.app.connName"></a><span class="sep">/</span>
                <span>Tags</span>
              </nav>
              <div class="page-head">
                <h1 class="page-title">Tags</h1>
              </div>
              <form class="toolbar" @submit.prevent="create()" autocomplete="off">
                <input class="input" type="text" x-model="newNames" placeholder="new-tag, another-tag" aria-label="New tags (comma-separated)" style="max-width:320px">
                <button type="submit" class="btn primary" :disabled="busy || !newNames.trim()"><svg class="ic"><use href="#i-plus"/></svg> Create</button>
              </form>
              <p class="form-hint-text">Names become kebab-case. Renaming to a name that already exists merges the two tags in every item.</p>
              <p class="form-error" x-show="error" x-text="error" role="alert"></p>
              <div class="state error" x-show="$store.app.tagsError" role="alert">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Could not list tags</h3>
                <p x-text="$store.app.tagsError"></p>
                <button class="btn" @click="$store.app.loadTags()">Try again</button>
              </div>
              <div class="state" x-show="!$store.app.tagsError && !$store.app.tagsLoading && !tags.length">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>No tags yet</h3>
                <p>Tags appear here when an item uses one, or when you create one above.</p>
              </div>
              <div class="tag-list">
                <template x-for="t in tags" :key="t.name">
                  <div class="tag-row">
                    <template x-if="editing !== t.name">
                      <span class="grow"><span class="chip outline" x-text="'#' + t.name"></span> <span class="muted" x-text="t.count + (t.count === 1 ? ' item' : ' items')"></span></span>
                    </template>
                    <template x-if="editing === t.name">
                      <form class="grow toolbar" @submit.prevent="rename()">
                        <input class="input" type="text" x-model="newName" :aria-label="'New name for ' + t.name" style="max-width:260px">
                        <button type="submit" class="btn primary sm" :disabled="busy">Save</button>
                        <button type="button" class="btn ghost sm" @click="cancel()">Cancel</button>
                      </form>
                    </template>
                    <span class="muted" x-show="pending?.name === t.name" x-text="'Removes it from ' + pending?.items + ' item(s).'"></span>
                    <button class="btn sm" x-show="editing !== t.name" :disabled="busy" @click="startRename(t)"><svg class="ic"><use href="#i-edit"/></svg> Rename</button>
                    <button class="btn danger sm" :disabled="busy" @click="remove(t)" x-text="pending?.name === t.name ? 'Confirm: delete' : 'Delete'"></button>
                    <button class="btn ghost sm" x-show="pending?.name === t.name" @click="cancel()">Cancel</button>
                  </div>
                </template>
              </div>
            </div></div>
          </template>
          <!-- /Tags -->

          <!-- Configurações · Conexões: listar, editar, definir a padrão e apagar. Criar é pelo MCP. -->
          <template x-if="$store.app.route.name === 'connections'">
            <div class="page"><div class="doc" x-data="connectionsView">
              <nav class="crumbs">
                <a href="#/settings/connections" x-show="sub">Conexões</a><span class="sep" x-show="sub">/</span>
                <span x-show="!sub">Configurações</span>
                <span x-show="conn" x-text="conn?.name"></span>
                <a class="crumb-back" href="#/settings/connections" x-show="sub"><svg class="ic"><use href="#i-arrow-left"/></svg> Voltar</a>
              </nav>

              <!-- Lista -->
              <template x-if="!sub">
                <div>
                  <div class="page-head">
                    <h1 class="page-title">Conexões</h1>
                  </div>
                  <div class="state error" x-show="error || $store.app.connError" role="alert">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Não foi possível listar as conexões</h3>
                    <p x-text="error || $store.app.connError"></p>
                    <button class="btn" @click="load()">Tentar de novo</button>
                  </div>
                  <div class="state" x-show="!error && !$store.app.connError && !loading && !$store.app.connections.length">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Nenhuma conexão ainda</h3>
                    <p>Cada conexão é uma pasta (repositório git) onde ficam os dados. A criação é pelo MCP, com a ferramenta <code>connection_create</code>. Por exemplo:</p>
                    <pre class="mono"><code>connection_create(name="pessoal", path="C:\\caminho\\da\\pasta")</code></pre>
                    <p class="form-hint-text">Depois de criar, recarregue esta página.</p>
                  </div>
                  <div class="conn-list" x-show="!error && !$store.app.connError && $store.app.connections.length">
                    <template x-for="c in $store.app.connections" :key="c.id">
                      <a class="conn-row" :href="'#/settings/connections/' + encodeURIComponent(c.id)">
                        <span class="dot" :class="dotClass(c)" :title="lastTest(c)"></span>
                        <span class="conn-main">
                          <span class="conn-name"><b x-text="c.name"></b>
                            <span class="chip outline" x-text="c.review_mode"></span>
                            <span class="chip accent" x-show="c.is_default">Padrão</span>
                            <span class="chip outline" x-show="!c.enabled">Desativada</span>
                            <span class="chip outline" :class="{ accent: folderState(c).ok }" x-text="folderState(c).label"></span>
                            <span class="chip warn" x-show="parseErrors(c).length" x-text="'⚠ ' + parseErrors(c).length + ' arquivo(s) ilegível(is)'"></span>
                          </span>
                          <span class="conn-sub mono" x-text="c.path || '(sem caminho)'" :title="c.path"></span>
                          <span class="conn-sub" x-text="c.remote_url ? 'Remote: ' + c.remote_url : 'Só local (sem remote)'"></span>
                        </span>
                        <span class="conn-test muted">
                          <span x-text="lastTest(c)"></span>
                          <span x-show="c.last_test" x-text="' · ' + $ago(c.last_test?.tested_at)"></span>
                        </span>
                      </a>
                    </template>
                  </div>
                  <p class="form-hint-text" x-show="$store.app.connections.length">Para criar outra conexão, use a ferramenta MCP <code>connection_create</code>.</p>
                </div>
              </template>

              <!-- Detalhe -->
              <template x-if="sub">
                <div>
                  <h1 class="page-title" x-text="conn ? conn.name : 'Conexão'"></h1>
                  <p class="page-meta" x-show="conn">
                    <span class="chip accent" x-show="conn?.is_default">Padrão</span>
                    <span class="chip outline" x-show="conn" x-text="conn ? folderState(conn).label : ''"></span>
                  </p>
                  <p class="mono" x-show="conn" x-text="conn?.path"></p>
                  <template x-if="conn && parseErrors(conn).length">
                    <div class="banner" role="alert">
                      <svg class="ic"><use href="#i-alert"/></svg>
                      <div>
                        <b>Arquivos ignorados na leitura</b>
                        <ul class="links">
                          <template x-for="e in parseErrors(conn)" :key="e.path">
                            <li><span class="mono" x-text="e.path"></span>: <span x-text="e.error"></span></li>
                          </template>
                        </ul>
                      </div>
                    </div>
                  </template>

                  <div class="state error" x-show="notFound" role="alert">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Conexão não encontrada</h3>
                    <a class="btn" href="#/settings/connections">Voltar para as conexões</a>
                  </div>

                  <div x-show="!notFound">
                    <p class="form-error" x-show="error" x-text="error" role="alert"></p>

                    <!-- Edição: nome, remote, modo e ativar. A pasta não muda por aqui. -->
                    <form x-show="conn" @submit.prevent="save()" autocomplete="off">
                      <div class="form-row">
                        <div class="field grow"><label for="c-name">Nome</label>
                          <input id="c-name" class="input" type="text" x-model="form.name" maxlength="255" required></div>
                        <div class="field"><label for="c-review">Modo de publicação</label>
                          <select id="c-review" class="select" x-model="form.review_mode">
                            <option value="direct">Direto</option>
                            <option value="pr">Pull request</option>
                          </select></div>
                      </div>

                      <div class="field"><label for="c-remote">Remote git</label>
                        <input id="c-remote" class="input mono" type="text" x-model="form.remote_url" placeholder="(vazio = só local)">
                        <span class="form-hint-text">Opcional. Sem remote, o repositório fica só nesta máquina.</span></div>

                      <label class="check"><input type="checkbox" x-model="form.enabled"> Ativa</label>

                      <div class="toolbar" style="margin-top:14px">
                        <button type="submit" class="btn primary" :disabled="saving" x-text="saving ? 'Salvando…' : 'Salvar'"></button>
                        <button type="button" class="btn" :disabled="saving || testing" @click="saveAndTest()">Salvar e testar</button>
                        <a class="btn ghost" href="#/settings/connections">Cancelar</a>
                      </div>
                    </form>

                    <!-- Resultado do teste: mensagem + latência -->
                    <div class="alert-inline" :class="alert?.kind" x-show="alert" role="status">
                      <svg class="ic"><use :href="alert?.kind === 'ok' ? '#i-check' : '#i-alert'"/></svg>
                      <span x-text="alert?.message"></span>
                      <b x-show="alert && alert.latency !== null" x-text="alert?.latency + ' ms'"></b>
                    </div>

                    <template x-if="conn">
                      <div>
                        <h2 class="section-title">Ações</h2>
                        <div class="toolbar">
                          <button class="btn" :disabled="testing" @click="test()"><svg class="ic"><use href="#i-refresh"/></svg> <span x-text="testing ? 'Testando…' : 'Testar'"></span></button>
                          <button class="btn" :disabled="conn.is_default || !conn.enabled" @click="makeDefault()">Definir como padrão</button>
                        </div>
                        <p class="form-hint-text">"Testar" usa a configuração salva. "Definir como padrão" também muda a conexão usada pelas ferramentas MCP chamadas sem <code>connection_id</code>.</p>

                        <div class="danger-zone">
                          <h2 class="section-title">Zona de perigo</h2>
                          <p>Tira a conexão da lista — a pasta do repositório e os arquivos dela ficam intactos. Digite <b x-text="conn.name"></b> para confirmar.</p>
                          <p class="form-hint-text" x-show="conn.is_default">Esta é a padrão atual: outra conexão ativa assume o posto (se houver).</p>
                          <div class="toolbar">
                            <input class="input" type="text" x-model="confirmName" :placeholder="conn.name" aria-label="Nome da conexão para confirmar" autocomplete="off" style="max-width:260px">
                            <button class="btn danger" :disabled="!dangerReady || deleting" @click="remove()">Apagar conexão</button>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div></div>
          </template>
          <!-- /Configurações · Conexões -->

          <template x-if="$store.app.route.name === 'notfound'">
            <div class="page"><div class="doc">
              <div class="state">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Page not found</h3>
                <p>This address does not match any screen.</p>
                <a class="btn" href="#/">Go to start</a>
              </div>
            </div></div>
          </template>

        </div>
      </template>
    </div>
  </div>

  <!-- Ctrl/Cmd+K palette -->
  <template x-if="$store.app.paletteOpen">
  <div class="overlay" x-data="palette" @click.self="$store.app.paletteOpen = false">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Search and commands">
      <div class="pal-input">
        <svg class="ic"><use href="#i-search"/></svg>
        <input x-ref="input" x-model="q" type="text" placeholder="Search items across every workspace, project, actions…" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="pal-list"
               :aria-activedescendant="'pal-' + sel"
               @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)"
               @keydown.enter.prevent="chooseSelected()">
        <kbd>Esc</kbd>
      </div>
      <div class="pal-list" id="pal-list" role="listbox">
        <template x-for="g in groups" :key="g.label">
          <div class="pal-group">
            <div class="pal-label" x-text="g.label"></div>
            <template x-for="e in g.entries" :key="e.key">
              <button class="pal-item" role="option" :id="'pal-' + e.idx" :class="{ active: e.idx === sel }"
                      :aria-selected="e.idx === sel" @click="choose(e)" @mousemove="sel = e.idx">
                <template x-if="e.icon"><svg class="ic"><use :href="'#i-' + e.icon"/></svg></template>
                <span class="pal-body">
                  <span class="pal-title" x-text="e.title"></span>
                  <span class="pal-sub" x-show="e.sub" x-text="e.sub"></span>
                  <span class="pal-sub" x-show="e.summary" x-text="e.summary"></span>
                </span>
                <span class="tbadge" x-show="e.type" :class="$tc(e.type)"><span class="tdot" aria-hidden="true"></span><span x-text="$kind(e.type, e.subtype)"></span></span>
              </button>
            </template>
          </div>
        </template>
        <div class="pal-empty" x-show="!flat.length && !searching">Nothing found for “<span x-text="q"></span>”.</div>
      </div>
    </div>
  </div>
  </template>

  <!-- New item / project / workspace -->
  <template x-if="$store.app.modal">
  <div class="overlay" x-data="newModal" @click.self="close()">
    <form class="dialog wide" role="dialog" aria-modal="true" :aria-label="title" @submit.prevent="submit()">
      <div class="dialog-head"><h2 x-text="title"></h2>
        <button type="button" class="btn icon ghost" @click="close()" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="dialog-body">
        <template x-if="kind === 'workspace'">
          <div>
            <div class="field"><label for="m-name">Name</label>
              <input id="m-name" x-ref="first" class="input" type="text" x-model="form.name" maxlength="255" required></div>
            <div class="field"><label for="m-desc">Description</label>
              <textarea id="m-desc" class="textarea" rows="3" x-model="form.description"></textarea></div>
            <div class="field"><label for="m-scope">Scope</label>
              <select id="m-scope" class="select" x-model="form.scope">
                <option value="">Not set (scoped)</option>
                <template x-for="sc in scopes" :key="sc"><option :value="sc" x-text="sc"></option></template>
              </select></div>
            <p class="muted" style="font-size:13px;margin:0">Will be created in the <b x-text="$store.app.connName"></b> connection.</p>
          </div>
        </template>

        <template x-if="kind === 'project'">
          <div>
            <div class="field"><label for="m-ws">Workspace</label>
              <select id="m-ws" class="select" x-model="form.workspace_id">
                <template x-for="w in $store.app.workspaces" :key="w.id"><option :value="w.id" x-text="w.name"></option></template>
              </select></div>
            <div class="field"><label for="m-pname">Name</label>
              <input id="m-pname" x-ref="first" class="input" type="text" x-model="form.name" maxlength="255" required></div>
            <div class="field"><label for="m-pdesc">Description</label>
              <textarea id="m-pdesc" class="textarea" rows="3" x-model="form.description"></textarea></div>
            <div class="field"><label for="m-pscope">Scope</label>
              <select id="m-pscope" class="select" x-model="form.scope">
                <option value="">Not set (inherit from workspace)</option>
                <template x-for="sc in scopes" :key="sc"><option :value="sc" x-text="sc"></option></template>
              </select></div>
          </div>
        </template>

        <template x-if="kind === 'item'">
          <div>
            <p class="muted" style="font-size:13px;margin:0 0 12px">Workspace: <b x-text="$store.app.workspace?.name"></b></p>
            <div class="field"><label for="m-title">Title</label>
              <input id="m-title" x-ref="first" class="input" type="text" x-model="form.title" maxlength="255" required></div>
            <div class="form-row">
              <div class="field"><label for="m-project">Project</label>
                <select id="m-project" class="select" x-model="form.project_id">
                  <template x-for="p in projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                </select></div>
              <div class="field"><label for="m-type">Type</label>
                <select id="m-type" class="select" x-model="form.type">
                  <template x-for="t in types" :key="t"><option :value="t" x-text="$tlabel(t)"></option></template>
                </select></div>
              <div class="field"><label for="m-subtype">Subtype</label>
                <select id="m-subtype" class="select" x-model="form.subtype" :disabled="!subtypes.length">
                  <option value="">None</option>
                  <template x-for="st in subtypes" :key="st"><option :value="st" x-text="$stlabel(st)"></option></template>
                </select></div>
              <div class="field"><label for="m-iscope">Scope</label>
                <select id="m-iscope" class="select" x-model="form.scope">
                  <option value="">Inherit</option>
                  <template x-for="sc in scopes" :key="sc"><option :value="sc" x-text="sc"></option></template>
                </select></div>
            </div>
            <p class="form-hint" x-show="!projects.length">This workspace has no projects yet: create one before the item.</p>
            <div class="field"><label for="m-sum">Summary</label>
              <input id="m-sum" class="input" type="text" x-model="form.summary" required></div>
            <div class="field"><label for="m-content">Content (Markdown)</label>
              <textarea id="m-content" class="textarea mono" rows="8" x-model="form.content" spellcheck="false"></textarea></div>
            <div class="form-row">
              <div class="field"><label for="m-tags">Tags (comma-separated)</label>
                <input id="m-tags" class="input" type="text" x-model="form.tags"></div>
            </div>
          </div>
        </template>

        <p class="form-error" x-show="error" x-text="error" role="alert"></p>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn" @click="close()">Cancel</button>
        <button type="submit" class="btn primary" :disabled="saving" x-text="saving ? 'Creating…' : 'Create'"></button>
      </div>
    </form>
  </div>
  </template>

  <!-- Shortcuts -->
  <template x-if="$store.app.helpOpen">
  <div class="overlay" @click.self="$store.app.helpOpen = false">
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
      <div class="dialog-head"><h2>Keyboard shortcuts</h2>
        <button class="btn icon ghost" @click="$store.app.helpOpen = false" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="dialog-body">
        <template x-for="s in $store.app.shortcuts" :key="s.label">
          <div class="kbd-row">
            <span x-text="s.label"></span>
            <span class="kbd-keys"><template x-for="k in s.keys" :key="k"><kbd x-text="k"></kbd></template></span>
          </div>
        </template>
      </div>
    </div>
  </div>
  </template>

  <!-- Toasts -->
  <div class="toasts" aria-live="polite">
    <template x-for="t in $store.app.toasts" :key="t.id">
      <div class="toast" :class="t.kind" x-text="t.message"></div>
    </template>
  </div>
</div>
</body>
</html>
