<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge OS</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M16 10 10 21.5M16 10l6 11.5M10 21.5h12' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='10' r='3' fill='white'/%3E%3Ccircle cx='10' cy='21.5' r='3' fill='white'/%3E%3Ccircle cx='22' cy='21.5' r='3' fill='white'/%3E%3C/svg%3E">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
<noscript><div class="fullscreen"><div class="box"><h3>Knowledge OS</h3><p>Este painel precisa de JavaScript.</p></div></div></noscript>

<!-- Sprite: logo colorida (viewBox 32) e ícones de ação/navegação (viewBox 24, traço 1.75, sem preenchimento) -->
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 32 32"><rect width='32' height='32' rx='7' fill='#4f46e5'/><path d='M16 10 10 21.5M16 10l6 11.5M10 21.5h12' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><circle cx='16' cy='10' r='3' fill='white'/><circle cx='10' cy='21.5' r='3' fill='white'/><circle cx='22' cy='21.5' r='3' fill='white'/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-chevrons" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.5-4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h8M16 6h4M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4V4h11v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13 7 4 4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></symbol>
</svg>

<div x-data x-cloak>

  <!-- Falha ao iniciar -->
  <div class="fullscreen" x-show="$store.app.bootError" role="alert">
    <div class="box">
      <svg class="logo"><use href="#logo"/></svg>
      <h2>Não foi possível carregar</h2>
      <p class="muted" x-text="$store.app.bootError"></p>
      <button class="btn" @click="$store.app.boot()">Tentar de novo</button>
    </div>
  </div>

  <div class="app" x-show="!$store.app.bootError"
       :class="{ wide: $store.app.wide, 'drawer-open': $store.app.drawer }">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" aria-label="Navegação">
      <a class="brand" :href="$store.app.connId ? $store.app.hConn() : '#/'">
        <svg class="logo"><use href="#logo"/></svg>
        <span>Knowledge OS</span>
      </a>

      <div class="tree-empty" x-show="$store.app.connError" role="alert">
        <span x-text="'Conexões indisponíveis: ' + $store.app.connError"></span>
        <button class="btn" @click="$store.app.boot()">Tentar de novo</button>
      </div>

      <div class="switcher">
        <!-- Connection -->
        <div class="dd" x-data="dropdown" @click.outside="close()" @keydown.escape.window="close()">
          <button class="dd-btn" @click="toggle()" :aria-expanded="open" aria-haspopup="listbox">
            <svg class="ic"><use href="#i-db"/></svg>
            <span class="dd-text">
              <span class="dd-label">Connection</span>
              <span class="dd-value" x-text="$store.app.connName"></span>
            </span>
            <svg class="ic dd-chev"><use href="#i-chevrons"/></svg>
          </button>
          <div class="dd-menu" x-show="open" x-cloak role="listbox">
            <template x-for="c in $store.app.connections" :key="c.id">
              <button class="dd-item" role="option" :class="{ active: c.id === $store.app.connId }"
                      :disabled="!c.enabled" @click="close(); $store.app.pickConnection(c.id)">
                <span class="dot" :class="{ off: !c.enabled }"></span>
                <span class="grow" x-text="c.name"></span>
                <span class="chip accent" x-show="c.is_default">Default</span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <!-- Árvore: todos os workspaces da conexão, cada um como gaveta (Workspace → Project → Subject → Item) -->
      <nav class="tree" aria-label="Workspaces">
        <template x-for="w in $store.app.workspaces" :key="w.id">
          <div>
            <div class="tree-row" :class="{ active: $store.app.route.name === 'workspace' && $store.app.route.params.ws === w.id }">
              <button class="tw" @click="$store.app.toggleWorkspace(w.id)"
                      :aria-label="($store.app.isWorkspaceOpen(w.id) ? 'Recolher ' : 'Expandir ') + w.name"
                      :aria-expanded="$store.app.isWorkspaceOpen(w.id)">
                <svg class="ic" :class="{ open: $store.app.isWorkspaceOpen(w.id) }"><use href="#i-chevron"/></svg>
              </button>
              <a class="tree-link" :href="$store.app.hWs(w.id)">
                <svg class="ic"><use href="#i-box"/></svg>
                <span class="tl-text" x-text="w.name"></span>
              </a>
              <a class="tw" :href="$store.app.hGraph(w.id)" :aria-label="'Grafo de ' + w.name" title="Grafo">
                <svg class="ic"><use href="#i-command"/></svg>
              </a>
            </div>

            <div class="tree-items" x-show="$store.app.isWorkspaceOpen(w.id)">
              <template x-if="$store.app.treeLoadingWs[w.id] && !$store.app.trees[w.id]">
                <div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>
              </template>
              <template x-if="$store.app.trees[w.id]">
                <div>
                  <template x-for="p in ($store.app.trees[w.id]?.projects || [])" :key="p.id">
                    <div>
                      <div class="tree-row" :class="{ active: $store.app.route.name === 'project' && $store.app.route.params.pj === p.id }">
                        <button class="tw" @click="$store.app.toggleProject(p.id)"
                                :aria-label="($store.app.isOpen(p.id) ? 'Recolher ' : 'Expandir ') + p.name"
                                :aria-expanded="$store.app.isOpen(p.id)">
                          <svg class="ic" :class="{ open: $store.app.isOpen(p.id) }"><use href="#i-chevron"/></svg>
                        </button>
                        <a class="tree-link" :href="$store.app.hProjectIn(w.id, p.id)">
                          <svg class="ic"><use href="#i-folder"/></svg>
                          <span class="tl-text" x-text="p.name"></span>
                          <span class="count" x-text="p.item_count"></span>
                        </a>
                      </div>
                      <div class="tree-items" x-show="$store.app.isOpen(p.id)">
                        <template x-for="s in (p.subjects || [])" :key="s.id">
                          <div class="tree-subject">
                            <div class="tree-row">
                              <button class="tw" @click="$store.app.toggleProject(p.id + ':' + s.id)"
                                      :aria-label="($store.app.isOpen(p.id + ':' + s.id) ? 'Recolher ' : 'Expandir ') + s.name"
                                      :aria-expanded="$store.app.isOpen(p.id + ':' + s.id)">
                                <svg class="ic" :class="{ open: $store.app.isOpen(p.id + ':' + s.id) }"><use href="#i-chevron"/></svg>
                              </button>
                              <a class="tree-link" :href="$store.app.hSubjectIn(w.id, p.id, s.id)"
                                 :class="{ active: $store.app.route.name === 'subject' && $store.app.route.params.subj === s.id }">
                                <span class="tl-text" x-text="s.name"></span>
                                <span class="count" x-text="s.item_count"></span>
                              </a>
                            </div>
                            <div class="tree-items" x-show="$store.app.isOpen(p.id + ':' + s.id)">
                              <template x-for="it in s.items" :key="it.id">
                                <a class="tree-item" :class="{ active: $store.app.route.params.item === it.id }"
                                   :href="$store.app.hItemIn(w.id, p.id, it.id)" :title="it.title">
                                  <span class="tdot" :class="$tc(it.type)" aria-hidden="true"></span>
                                  <span class="sr-only" x-text="$tlabel(it.type) + ': '"></span><span x-text="it.title"></span>
                                </a>
                              </template>
                              <div class="tree-empty" x-show="!s.items.length">Sem itens</div>
                            </div>
                          </div>
                        </template>
                        <template x-for="it in p.items" :key="it.id">
                          <a class="tree-item" :class="{ active: $store.app.route.params.item === it.id }"
                             :href="$store.app.hItemIn(w.id, p.id, it.id)" :title="it.title">
                            <span class="tdot" :class="$tc(it.type)" aria-hidden="true"></span>
                            <span class="sr-only" x-text="$tlabel(it.type) + ': '"></span><span x-text="it.title"></span>
                          </a>
                        </template>
                        <div class="tree-empty" x-show="!p.items.length && !(p.subjects || []).length">Sem itens</div>
                      </div>
                    </div>
                  </template>
                  <div class="tree-empty" x-show="!($store.app.trees[w.id]?.projects?.length)">Este workspace ainda não tem projects.</div>
                </div>
              </template>
              <div class="tree-empty" x-show="$store.app.treeErrorWs[w.id]" x-text="$store.app.treeErrorWs[w.id]"></div>
            </div>
          </div>
        </template>
        <div class="tree-empty" x-show="!$store.app.workspaces.length">Nenhum workspace nesta conexão.</div>
      </nav>

      <div class="side-foot">
        <a class="side-link" :class="{ active: $store.app.route.name === 'connections' }" :href="$store.app.hConnections()">
          <svg class="ic"><use href="#i-settings"/></svg> Configurações · Conexões
        </a>
      </div>
    </aside>
    <div class="scrim" @click="$store.app.drawer = false"></div>

    <!-- ===== Conteúdo ===== -->
    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" @click="$store.app.drawer = true" aria-label="Abrir menu">
          <svg class="ic"><use href="#i-menu"/></svg>
        </button>
        <button class="search-btn" @click="$store.app.paletteOpen = true" aria-label="Buscar e comandos">
          <svg class="ic"><use href="#i-search"/></svg>
          <span class="search-txt">Buscar…</span>
          <kbd x-text="$store.app.isMac ? '⌘K' : 'Ctrl K'"></kbd>
        </button>
        <div class="spacer"></div>
        <div class="dd" x-data="dropdown" @click.outside="close()" @keydown.escape.window="close()">
          <button class="btn" @click="toggle()" :aria-expanded="open" aria-haspopup="menu">
            <svg class="ic"><use href="#i-plus"/></svg> Novo
          </button>
          <div class="dd-menu right" x-show="open" x-cloak role="menu">
            <button class="dd-item" role="menuitem" :disabled="!$store.app.route.params.ws" @click="close(); $store.app.openModal('item')">
              <svg class="ic"><use href="#i-file"/></svg><span class="grow">Novo item</span></button>
            <button class="dd-item" role="menuitem" :disabled="!$store.app.workspaces.length" @click="close(); $store.app.openModal('project')">
              <svg class="ic"><use href="#i-folder"/></svg><span class="grow">Novo project</span></button>
            <button class="dd-item" role="menuitem" @click="close(); $store.app.openModal('workspace')">
              <svg class="ic"><use href="#i-box"/></svg><span class="grow">Novo workspace</span></button>
          </div>
        </div>
        <button class="btn icon ghost wide-btn" @click="$store.app.toggleWide()" :aria-pressed="$store.app.wide"
                :title="$store.app.wide ? 'Voltar à largura padrão' : 'Usar toda a largura'"
                :aria-label="$store.app.wide ? 'Voltar à largura padrão' : 'Usar toda a largura'">
          <svg class="ic"><use :href="'#i-' + ($store.app.wide ? 'shrink' : 'expand')"/></svg>
        </button>
        <button class="btn icon ghost" @click="$store.app.toggleTheme()"
                :title="$store.app.themeAction" :aria-label="$store.app.themeAction">
          <svg class="ic"><use :href="'#i-' + ($store.app.theme === 'dark' ? 'sun' : 'moon')"/></svg>
        </button>
      </header>

      <!-- Carregando -->
      <div class="page" x-show="!$store.app.ready" aria-busy="true">
        <div class="doc"><svg class="logo lg"><use href="#logo"/></svg><div class="skeleton" style="height:30px;width:40%;margin:0 0 16px"></div><div class="skeleton" style="margin:0 0 10px"></div><div class="skeleton" style="width:80%;margin:0"></div></div>
      </div>

      <template x-if="$store.app.ready">
        <div>

          <!-- Conexão: lista de workspaces -->
          <template x-if="$store.app.route.name === 'connection'">
            <div class="page"><div class="doc">
              <nav class="crumbs"><span x-text="$store.app.connName"></span></nav>
              <div class="page-head">
                <h1 class="page-title">Workspaces</h1>
                <div class="toolbar"><button class="btn primary" @click="$store.app.openModal('workspace')"><svg class="ic"><use href="#i-plus"/></svg> Novo workspace</button></div>
              </div>
              <div class="state error" x-show="$store.app.wsError" role="alert">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Não foi possível listar os workspaces</h3>
                <p x-text="$store.app.wsError"></p>
                <button class="btn" @click="$store.app.loadWorkspaces()">Tentar de novo</button>
              </div>
              <div class="card-grid" x-show="!$store.app.wsError">
                <template x-for="w in $store.app.workspaces" :key="w.id">
                  <a class="card" :href="$store.app.hWs(w.id)">
                    <span class="card-title"><svg class="ic"><use href="#i-box"/></svg><span class="tl-text" x-text="w.name"></span></span>
                    <span class="card-desc" x-text="w.description || 'Sem descrição'"></span>
                    <span class="card-foot" x-show="w.stats">
                      <span><b x-text="w.stats?.projects"></b> projects</span>
                      <span><b x-text="w.stats?.items"></b> itens</span>
                    </span>
                  </a>
                </template>
              </div>
              <div class="state" x-show="!$store.app.wsError && !$store.app.workspaces.length && !$store.app.wsLoading">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Nenhum workspace ainda</h3>
                <p>Esta conexão está vazia. Crie um workspace para começar.</p>
              </div>
            </div></div>
          </template>

          <!-- Workspace -->
          <template x-if="$store.app.route.name === 'workspace'">
            <div class="page" x-data="workspaceView"><div class="doc">
              <template x-if="$store.app.workspace">
                <div>
                  <nav class="crumbs">
                    <a :href="$store.app.hConn()" x-text="$store.app.connName"></a><span class="sep">/</span>
                    <span x-text="$store.app.workspace.name"></span>
                  </nav>
                  <div class="page-head">
                    <h1 class="page-title" x-text="$store.app.workspace.name"></h1>
                    <div class="toolbar"><a class="btn" :href="graphHref()">Ver grafo</a></div>
                  </div>
                  <div class="page-meta" x-show="$store.app.tree">
                    <span><b x-text="$store.app.tree?.projects?.length"></b> projects</span>
                    <span><b x-text="totalItems"></b> itens</span>
                    <span>criado <b x-text="$ago($store.app.workspace.created_at)"></b></span>
                  </div>

                  <div class="filterbar">
                    <label class="searchbox">
                      <svg class="ic"><use href="#i-search"/></svg>
                      <input type="search" class="input" x-model="$store.app.filters.q" placeholder="Buscar neste workspace…" aria-label="Buscar itens" autocomplete="off">
                    </label>
                    <div class="type-chips" role="group" aria-label="Filtrar por tipo">
                      <button class="tchip" :class="{ on: !filters.types.length }" :aria-pressed="!filters.types.length" @click="clearTypes()">
                        Todos <span class="n" x-show="!searchMode" x-text="items.length"></span>
                      </button>
                      <template x-for="c in chipTypes" :key="c.type">
                        <button class="tchip" :class="[$tc(c.type), { on: filters.types.includes(c.type) }]"
                                :aria-pressed="filters.types.includes(c.type)" @click="toggleType(c.type)">
                          <span class="tdot" aria-hidden="true"></span>
                          <span x-text="c.label"></span> <span class="n" x-show="c.count != null" x-text="c.count"></span>
                        </button>
                      </template>
                      <button class="btn ghost sm" x-show="filtering" @click="clearFilters()">Limpar filtros</button>
                    </div>
                  </div>
                  <div class="banner" role="alert" x-show="searchError">
                    <svg class="ic"><use href="#i-alert"/></svg><span x-text="'Busca indisponível: ' + searchError"></span>
                  </div>

                  <template x-if="!filtering">
                  <div>
                  <div class="section-title"><span>Projects</span>
                    <button class="btn" @click="$store.app.openModal('project')"><svg class="ic"><use href="#i-plus"/></svg> Novo project</button></div>
                  <div class="card-grid">
                    <template x-for="p in $store.app.tree?.projects || []" :key="p.id">
                      <a class="card" :href="$store.app.hProject(p.id)">
                        <span class="card-title"><svg class="ic"><use href="#i-folder"/></svg><span class="tl-text" x-text="p.name"></span><span class="count" x-text="p.item_count"></span></span>
                        <span class="card-desc" x-show="p.description" x-text="p.description"></span>
                        <ul class="mini-list">
                          <template x-for="it in previewItems(p)" :key="it.id"><li x-text="'· ' + it.title"></li></template>
                        </ul>
                      </a>
                    </template>
                  </div>
                  </div>
                  </template>
                  <div class="state" x-show="$store.app.tree && !$store.app.tree.projects.length">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Sem projects</h3>
                    <p>Este workspace ainda não tem projects.</p>
                  </div>

                  <template x-if="recent.length && !filtering">
                    <div>
                      <div class="section-title">Atualizados recentemente</div>
                      <div class="item-list">
                        <template x-for="it in recent" :key="it.id">
                          <a class="item-row" :href="$store.app.hItem(it.project_id, it.id)">
                            <div>
                              <div class="ir-title" x-text="it.title"></div>
                              <div class="ir-meta">
                                <span class="tbadge" :class="$tc(it.type)"><span class="tdot" aria-hidden="true"></span><span x-text="$tlabel(it.type)"></span></span>
                                <span class="chip outline" x-text="it.project_name"></span>
                                <span class="muted" style="font-size:12.5px" x-text="$ago(it.updated_at)"></span>
                              </div>
                            </div>
                          </a>
                        </template>
                      </div>
                    </div>
                  </template>

                  <div class="section-title"><span x-text="filtering ? 'Resultados' : 'Todos os itens'"></span>
                    <span class="muted" x-show="searching">Buscando…</span></div>
                  <div class="banner" role="alert" x-show="error">
                    <svg class="ic"><use href="#i-alert"/></svg><span x-text="'Não foi possível carregar os itens: ' + error"></span>
                    <button class="btn" @click="loadItems()">Tentar de novo</button>
                  </div>
                  <template x-for="g in groups" :key="g.type">
                    <section class="group">

                      <span class="muted" style="font-size:12.5px" :title="fullDate(item.updated_at)" x-text="'atualizado ' + $ago(item.updated_at)"></span>
                    </div>

                    <template x-if="!$store.app.route.params.edit && item.type !== 'secret'">
                      <div>
                        <div class="prose" x-show="!showRaw" @click="onProseClick($event)"
                             x-effect="renderInto($el, item.content)"></div>
                        <pre class="raw" x-show="showRaw" x-text="item.content"></pre>
                      </div>
                    </template>

                    <template x-if="$store.app.route.params.edit && item && item.id === $store.app.route.params.item">
                      <div class="editor" x-data="itemEditor(item, (u) => applyUpdate(u))">
                        <div class="editor-meta">
                          <div class="field grow"><label for="ed-title">Título</label>
                            <input id="ed-title" class="input" type="text" maxlength="255" x-model="draft.title"></div>
                          <div class="field"><label for="ed-type">Tipo</label>
                            <select id="ed-type" class="select" x-model="draft.type">
                              <template x-for="t in types" :key="t"><option :value="t" :selected="t === draft.type" x-text="$tlabel(t)"></option></template>
                            </select></div>
                          <div class="field grow"><label for="ed-summary">Resumo</label>
                            <input id="ed-summary" class="input" type="text" x-model="draft.summary"></div>
                          <div class="field grow"><label for="ed-tags">Tags (separadas por vírgula)</label>
                            <input id="ed-tags" class="input" type="text" x-model="draft.tags"></div>
                        </div>
                        <div class="editor-grid">
                          <div class="editor-col">
                            <label class="editor-label" for="ed-content">Markdown</label>
                            <textarea id="ed-content" x-ref="content" class="textarea editor-ta" x-model="draft.content" spellcheck="false"></textarea>
                          </div>
                          <div class="editor-col">
                            <div class="editor-label">Preview</div>
                            <div class="prose editor-prev" x-effect="preview($el)"></div>
                          </div>
                        </div>
                        <div class="editor-bar">
                          <span class="muted" x-show="dirty">Alterações não salvas</span>
                          <span class="form-error" x-show="error" x-text="error" role="alert"></span>
                          <span class="grow"></span>
                          <button class="btn" @click="$store.app.toggleEdit()">Fechar edição</button>
                          <button class="btn primary" :disabled="!dirty || saving" @click="save()">
                            <span x-text="saving ? 'Salvando…' : 'Salvar'"></span> <kbd x-text="$store.app.isMac ? '⌘ S' : 'Ctrl S'"></kbd>
                          </button>
                        </div>
                      </div>
                    </template>

                    <template x-if="out.length || inc.length">
                      <section class="rels">
                        <h2 class="section-title">Relações</h2>
                        <div class="rel-cols">
                          <div x-show="out.length">
                            <h3 class="rel-h">Referencia</h3>
                            <template x-for="r in out" :key="r.id">
                              <a class="rel" :href="relHref(r.other)">
                                <span class="chip" x-text="r.type"></span>
                                <svg class="ic"><use href="#i-arrow-right"/></svg>
                                <span class="rel-t" x-text="relTitle(r.other)"></span>
                              </a>
                            </template>
                          </div>
                          <div x-show="inc.length">
                            <h3 class="rel-h">Referenciado por</h3>
                            <template x-for="r in inc" :key="r.id">
                              <a class="rel" :href="relHref(r.other)">
                                <span class="chip" x-text="r.type"></span>
                                <svg class="ic"><use href="#i-arrow-left"/></svg>
                                <span class="rel-t" x-text="relTitle(r.other)"></span>
                              </a>
                            </template>
                          </div>
                        </div>
                      </section>
                    </template>

                    <template x-if="artifacts.length">
                      <section>
                        <h2 class="section-title">Artifacts</h2>
                        <template x-for="a in artifacts" :key="a.id">
                          <div class="rel">
                            <span class="rel-t" x-text="a.filename"></span>
                            <span class="muted" style="font-size:12.5px" x-text="humanSize(a.file_size)"></span>
                            <button class="btn ghost icon" @click="downloadArtifact(a)" :aria-label="'Baixar ' + a.filename"><svg class="ic"><use href="#i-download"/></svg></button>
                          </div>
                        </template>
                      </section>
                    </template>

                    <nav class="pager" aria-label="Itens vizinhos">
                      <template x-if="prev">
                        <a class="pager-a" :href="$store.app.hItem(item.project_id, prev.id)">
                          <span class="muted">Anterior</span><b x-text="prev.title"></b>
                        </a>
                      </template>
                      <template x-if="next">
                        <a class="pager-a next" :href="$store.app.hItem(item.project_id, next.id)">
                          <span class="muted">Próximo</span><b x-text="next.title"></b>
                        </a>
                      </template>
                    </nav>
                  </article>
                </template>

                <div class="state error" x-show="notFound" role="alert">
                  <svg class="logo"><use href="#logo"/></svg>
                  <h3>Item não encontrado</h3>
                  <p>Ele pode ter sido removido ou pertencer a outra conexão.</p>
                  <a class="btn" :href="$store.app.hWs()">Voltar ao workspace</a>
                </div>
                <div class="state error" x-show="error" role="alert">
                  <svg class="logo"><use href="#logo"/></svg>
                  <h3>Não foi possível carregar o item</h3>
                  <p x-text="error"></p>
                  <button class="btn" @click="load()">Tentar de novo</button>
                </div>
              </div>

              <aside class="toc" x-show="item && headings.length" aria-label="Nesta página">
                <div class="toc-title">Nesta página</div>
                <template x-for="h in headings" :key="h.id">
                  <a class="toc-link" :class="{ active: active === h.id, sub: h.level === 3 }"
                     :href="'#' + h.id" @click.prevent="goTo(h.id)" x-text="h.text"></a>
                </template>
              </aside>
            </div>
          </template>

          <!-- Configurações · Conexões (T8) -->
          <template x-if="$store.app.route.name === 'connections'">
            <div class="page"><div class="doc" x-data="connectionsView">
              <nav class="crumbs">
                <a href="#/settings/connections" x-show="sub">Conexões</a><span class="sep" x-show="sub">/</span>
                <span x-show="!sub">Configurações</span>
                <span x-show="isNew">Nova conexão</span>
                <span x-show="conn" x-text="conn?.name"></span>
              </nav>

              <!-- Lista -->
              <template x-if="!sub">
                <div>
                  <div class="page-head">
                    <h1 class="page-title">Conexões</h1>
                    <div class="toolbar"><a class="btn primary" href="#/settings/connections/new"><svg class="ic"><use href="#i-plus"/></svg> Nova conexão</a></div>
                  </div>
                  <div class="state error" x-show="error || $store.app.connError" role="alert">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Não foi possível listar as conexões</h3>
                    <p x-text="error || $store.app.connError"></p>
                    <button class="btn" @click="load()">Tentar de novo</button>
                  </div>
                  <div class="conn-list" x-show="!error && !$store.app.connError">
                    <template x-for="c in $store.app.connections" :key="c.id">
                      <a class="conn-row" :href="'#/settings/connections/' + encodeURIComponent(c.id)">
                        <span class="dot" :class="dotClass(c)" :title="lastTest(c)"></span>
                        <span class="conn-main">
                          <span class="conn-name"><b x-text="c.name"></b>
                            <span class="chip outline" x-text="c.review_mode"></span>
                            <span class="chip accent" x-show="c.is_default">Default</span>
                            <span class="chip outline" x-show="c.is_catalog">Catálogo</span>
                            <span class="chip outline" x-show="!c.enabled">Desabilitada</span>
                          </span>
                          <span class="conn-sub" x-text="target(c)"></span>
                        </span>
                        <span class="conn-test muted">
                          <span x-text="lastTest(c)"></span>
                          <span x-show="c.last_test" x-text="' · ' + $ago(c.last_test?.tested_at)"></span>
                        </span>
                      </a>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Detalhe / nova -->
              <template x-if="sub">
                <div>
                  <h1 class="page-title" x-text="isNew ? 'Nova conexão' : (conn ? conn.name : 'Conexão')"></h1>
                  <p class="page-meta" x-show="conn">
                    <span class="chip outline" x-text="conn?.review_mode"></span>
                    <span class="chip accent" x-show="conn?.is_default">Default</span>
                    <span class="chip outline" x-show="conn?.is_catalog">Catálogo (somente leitura)</span>
                  </p>

                  <div class="state error" x-show="notFound" role="alert">
                    <svg class="logo"><use href="#logo"/></svg>
                    <h3>Conexão não encontrada</h3>
                    <a class="btn" href="#/settings/connections">Voltar às conexões</a>
                  </div>

                  <div x-show="!notFound">
                    <p class="form-error" x-show="error" x-text="error" role="alert"></p>

                    <!-- Formulário (não existe para o catálogo) -->
                    <form x-show="isNew || editable" @submit.prevent="save()" autocomplete="off">
                      <div class="form-row">
                        <div class="field grow"><label for="c-name">Nome</label>
                          <input id="c-name" class="input" type="text" x-model="form.name" maxlength="255" required></div>
                        <div class="field"><label for="c-review">Modo de publicação</label>
                          <select id="c-review" class="select" x-model="form.review_mode">
                            <option value="direct">Direto</option>
                            <option value="pr">Pull request</option>
                          </select></div>
                      </div>

                      <div class="field"><label for="c-remote">Remote git</label>
                        <input id="c-remote" class="input mono" type="text" x-model="form.remote_url" placeholder="https://github.com/org/repo.git">
                        <span class="form-hint-text">Em branco: repositório só local (sem GitHub). Clone e índice de busca vivem no home de dados.</span></div>

                      <label class="check"><input type="checkbox" x-model="form.enabled"> Habilitada</label>

                      <div class="toolbar" style="margin-top:14px">
                        <button type="submit" class="btn primary" :disabled="saving" x-text="saving ? 'Salvando…' : (isNew ? 'Criar' : 'Salvar')"></button>
                        <button type="button" class="btn" :disabled="saving || testing" @click="saveAndTest()">Salvar e testar</button>
                        <a class="btn ghost" href="#/settings/connections">Cancelar</a>
                      </div>
                    </form>

                    <!-- Resultado do teste: mensagem + latência (a mensagem vem sem a senha) -->
                    <div class="alert-inline" :class="alert?.kind" x-show="alert" role="status">
                      <svg class="ic"><use :href="alert?.kind === 'ok' ? '#i-check' : '#i-alert'"/></svg>
                      <span x-text="alert?.message"></span>
                      <b x-show="alert && alert.latency !== null" x-text="alert?.latency + ' ms'"></b>
                    </div>

                    <template x-if="conn">
                      <div>
                        <h2 class="section-title">Ações</h2>
                        <div class="toolbar">
                          <button class="btn" :disabled="testing" @click="test()"><svg class="ic"><use href="#i-refresh"/></svg> <span x-text="testing ? 'Testando…' : 'Testar'"></span></button>
                          <button class="btn" :disabled="conn.is_default || !conn.enabled" @click="makeDefault()">Definir como default</button>
                        </div>
                        <p class="form-hint-text">“Testar” usa a configuração salva. “Definir como default” também muda a conexão usada pelas tools MCP quando elas são chamadas sem <code>connection_id</code>.</p>

                        <h2 class="section-title">Schema</h2>
                        <div class="toolbar">
                          <button class="btn" :disabled="syncing" @click="syncSchema(true)">Sincronizar schema (dry-run)</button>
                          <button class="btn primary" x-show="plan" :disabled="syncing || !canApply" @click="syncSchema(false)">Aplicar</button>
                        </div>
                        <div class="plan" x-show="plan">
                          <p class="plan-title">Plano (nada foi gravado): <b x-text="plan?.status"></b></p>
                          <p class="muted" x-show="planEmpty && !plan?.pending_manual.length">O schema já está em dia.</p>
                          <template x-for="g in [['Tabelas a criar', plan?.tables_created], ['Colunas a adicionar', plan?.columns_added], ['Índices a criar', plan?.indexes_created], ['Diferenças manuais (não aplicadas)', plan?.pending_manual]]" :key="g[0]">
                            <div x-show="g[1] && g[1].length"><div class="rel-h" x-text="g[0]"></div>
                              <ul class="mini-list"><template x-for="x in g[1]" :key="x"><li x-text="x"></li></template></ul></div>
                          </template>
                          <p x-show="plan?.fts_created">Busca textual (FTS) a criar.</p>
                        </div>
                        <p class="form-hint-text" x-show="syncMessage" x-text="syncMessage"></p>

                        <div class="danger-zone" x-show="editable">
                          <h2 class="section-title">Zona de perigo</h2>
                          <p x-show="!canDelete">Esta é a conexão default: defina outra como default antes de excluí-la.</p>
                          <div x-show="canDelete">
                            <p>Exclui o cadastro da conexão (os dados do banco não são tocados). Digite <b x-text="conn.name"></b> para confirmar.</p>
                            <div class="toolbar">
                              <input class="input" type="text" x-model="confirmName" :placeholder="conn.name" aria-label="Nome da conexão para confirmar" autocomplete="off" style="max-width:260px">
                              <button class="btn danger" :disabled="!dangerReady || deleting" @click="remove()">Excluir conexão</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div></div>
          </template>
          <!-- /Configurações · Conexões -->

          <template x-if="$store.app.route.name === 'notfound'">
            <div class="page"><div class="doc">
              <div class="state">
                <svg class="logo"><use href="#logo"/></svg>
                <h3>Página não encontrada</h3>
                <p>O endereço não corresponde a nenhuma tela.</p>
                <a class="btn" href="#/">Ir para o início</a>
              </div>
            </div></div>
          </template>

        </div>
      </template>
    </div>
  </div>

  <!-- Paleta Ctrl/Cmd+K -->
  <template x-if="$store.app.paletteOpen">
  <div class="overlay" x-data="palette" @click.self="$store.app.paletteOpen = false">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Buscar e comandos">
      <div class="pal-input">
        <svg class="ic"><use href="#i-search"/></svg>
        <input x-ref="input" x-model="q" type="text" placeholder="Buscar itens em todos os workspaces, projects, ações…" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="pal-list"
               :aria-activedescendant="'pal-' + sel"
               @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)"
               @keydown.enter.prevent="chooseSelected()">
        <kbd>Esc</kbd>
      </div>
      <div class="pal-list" id="pal-list" role="listbox">
        <template x-for="g in groups" :key="g.label">
          <div class="pal-group">
            <div class="pal-label" x-text="g.label"></div>
            <template x-for="e in g.entries" :key="e.key">
              <button class="pal-item" role="option" :id="'pal-' + e.idx" :class="{ active: e.idx === sel }"
                      :aria-selected="e.idx === sel" @click="choose(e)" @mousemove="sel = e.idx">
                <template x-if="e.icon"><svg class="ic"><use :href="'#i-' + e.icon"/></svg></template>
                <span class="pal-body">
                  <span class="pal-title" x-text="e.title"></span>
                  <span class="pal-sub" x-show="e.sub" x-text="e.sub"></span>
                  <span class="pal-sub" x-show="e.summary" x-text="e.summary"></span>
                </span>
                <span class="tbadge" x-show="e.type" :class="$tc(e.type)"><span class="tdot" aria-hidden="true"></span><span x-text="$tlabel(e.type)"></span></span>
              </button>
            </template>
          </div>
        </template>
        <div class="pal-empty" x-show="!flat.length && !searching">Nada encontrado para “<span x-text="q"></span>”.</div>
      </div>
    </div>
  </div>
  </template>

  <!-- Novo item / project / workspace -->
  <template x-if="$store.app.modal">
  <div class="overlay" x-data="newModal" @click.self="close()">
    <form class="dialog wide" role="dialog" aria-modal="true" :aria-label="title" @submit.prevent="submit()">
      <div class="dialog-head"><h2 x-text="title"></h2>
        <button type="button" class="btn icon ghost" @click="close()" aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="dialog-body">
        <template x-if="kind === 'workspace'">
          <div>
            <div class="field"><label for="m-name">Nome</label>
              <input id="m-name" x-ref="first" class="input" type="text" x-model="form.name" maxlength="255" required></div>
            <div class="field"><label for="m-desc">Descrição</label>
              <textarea id="m-desc" class="textarea" rows="3" x-model="form.description"></textarea></div>
            <p class="muted" style="font-size:13px;margin:0">Será criado na conexão <b x-text="$store.app.connName"></b>.</p>
          </div>
        </template>

        <template x-if="kind === 'project'">
          <div>
            <div class="field"><label for="m-ws">Workspace</label>
              <select id="m-ws" class="select" x-model="form.workspace_id">
                <template x-for="w in $store.app.workspaces" :key="w.id"><option :value="w.id" x-text="w.name"></option></template>
              </select></div>
            <div class="field"><label for="m-pname">Nome</label>
              <input id="m-pname" x-ref="first" class="input" type="text" x-model="form.name" maxlength="255" required></div>
            <div class="field"><label for="m-pdesc">Descrição</label>
              <textarea id="m-pdesc" class="textarea" rows="3" x-model="form.description"></textarea></div>
          </div>
        </template>

        <template x-if="kind === 'item'">
          <div>
            <p class="muted" style="font-size:13px;margin:0 0 12px">Workspace: <b x-text="$store.app.workspace?.name"></b></p>
            <div class="field"><label for="m-title">Título</label>
              <input id="m-title" x-ref="first" class="input" type="text" x-model="form.title" maxlength="255" required></div>
            <div class="form-row">
              <div class="field"><label for="m-project">Project</label>
                <select id="m-project" class="select" x-model="form.project_id">
                  <template x-for="p in projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                </select></div>
              <div class="field"><label for="m-type">Tipo</label>
                <select id="m-type" class="select" x-model="form.type">
                  <template x-for="t in types" :key="t"><option :value="t" x-text="$tlabel(t)"></option></template>
                </select></div>
            </div>
            <p class="form-hint" x-show="!projects.length">Este workspace ainda não tem projects: crie um antes do item.</p>
            <div class="field"><label for="m-sum">Resumo</label>
              <input id="m-sum" class="input" type="text" x-model="form.summary" required></div>
            <div class="field"><label for="m-content">Conteúdo (Markdown)</label>
              <textarea id="m-content" class="textarea mono" rows="8" x-model="form.content" spellcheck="false" required></textarea></div>
            <div class="form-row">
              <div class="field"><label for="m-tags">Tags (separadas por vírgula)</label>
                <input id="m-tags" class="input" type="text" x-model="form.tags"></div>
            </div>
          </div>
        </template>

        <p class="form-error" x-show="error" x-text="error" role="alert"></p>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn" @click="close()">Cancelar</button>
        <button type="submit" class="btn primary" :disabled="saving" x-text="saving ? 'Criando…' : 'Criar'"></button>
      </div>
    </form>
  </div>
  </template>

  <!-- Atalhos -->
  <template x-if="$store.app.helpOpen">
  <div class="overlay" @click.self="$store.app.helpOpen = false">
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Atalhos de teclado">
      <div class="dialog-head"><h2>Atalhos de teclado</h2>
        <button class="btn icon ghost" @click="$store.app.helpOpen = false" aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="dialog-body">
        <template x-for="s in $store.app.shortcuts" :key="s.label">
          <div class="kbd-row">
            <span x-text="s.label"></span>
            <span class="kbd-keys"><template x-for="k in s.keys" :key="k"><kbd x-text="k"></kbd></template></span>
          </div>
        </template>
      </div>
    </div>
  </div>
  </template>

  <!-- Toasts -->
  <div class="toasts" aria-live="polite">
    <template x-for="t in $store.app.toasts" :key="t.id">
      <div class="toast" :class="t.kind" x-text="t.message"></div>
    </template>
  </div>
</div>
</body>
</html>
